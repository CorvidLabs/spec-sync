name: CI

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'specs/**'
      - '.specsync/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'action.yml'
      - 'examples/**'
      - 'fledge.toml'
      - 'site/**'
      - 'vscode-extension/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
      # `Required CI gate` is a required status check, so any path that cannot
      # trigger this workflow can never report it and blocks its PR forever.
      # Documentation-only changes hit that: the gate sat "Expected — waiting for
      # status to be reported" with nothing able to report it. Every mergeable
      # path must reach the gate; `classify` decides what work actually runs.
      - 'docs/**'
      - '*.md'
      - '.github/workflows/finalize-change.yml'
      - '.github/workflows/lifecycle-policy-guard.yml'
      - '.github/workflows/post-merge-archive.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/trust.yml'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'SECURITY.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'specs/**'
      - '.specsync/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'action.yml'
      - 'examples/**'
      - 'fledge.toml'
      - 'site/**'
      - 'vscode-extension/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
      # `Required CI gate` is a required status check, so any path that cannot
      # trigger this workflow can never report it and blocks its PR forever.
      # Documentation-only changes hit that: the gate sat "Expected — waiting for
      # status to be reported" with nothing able to report it. Every mergeable
      # path must reach the gate; `classify` decides what work actually runs.
      - 'docs/**'
      - '*.md'
      - '.github/workflows/finalize-change.yml'
      - '.github/workflows/lifecycle-policy-guard.yml'
      - '.github/workflows/post-merge-archive.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/trust.yml'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'SECURITY.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      archive_only: ${{ steps.paths.outputs.archive_only }}
      legacy_archive_only: ${{ steps.paths.outputs.legacy_archive_only }}
      archive_change_id: ${{ steps.paths.outputs.archive_change_id }}
      archive_dir: ${{ steps.paths.outputs.archive_dir }}
      archive_workflow_version: ${{ steps.paths.outputs.archive_workflow_version }}
      review_only: ${{ steps.paths.outputs.review_only }}
      review_change_id: ${{ steps.paths.outputs.review_change_id }}
      review_required: ${{ steps.paths.outputs.review_required }}
      review_required_change_id: ${{ steps.paths.outputs.review_required_change_id }}
      full: ${{ steps.paths.outputs.full }}
      site: ${{ steps.paths.outputs.site }}
      vscode: ${{ steps.paths.outputs.vscode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          force_full=false
          case "$EVENT_NAME" in
            pull_request)
              base="origin/$BASE_REF"
              parent_line="$(git rev-list --parents -n 1 "$HEAD_SHA")"
              if [[ "$(wc -w <<<"$parent_line" | tr -d ' ')" == "2" ]]; then
                parent="$(git rev-parse "$HEAD_SHA^")"
                child_output="$(
                  git diff --name-status -z -M "$parent" "$HEAD_SHA" \
                    | .github/scripts/classify-ci-paths.sh \
                        "$GITHUB_WORKSPACE" false name-status "$parent"
                )"
                # Hold the tip-only answer as a CANDIDATE only. It may narrow the
                # lane, but never contradict the whole-PR classification —
                # `change ship` always makes an archive commit last, so overriding
                # here unconditionally skipped the product lane on EVERY lifecycle
                # pull request (#626). select-ci-lane.sh applies the rule.
                tip_output="$child_output"
              fi
              ;;
            push)
              base="$BEFORE_SHA"
              if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                force_full=true
              fi
              ;;
            *)
              force_full=true
              ;;
          esac

          if [[ "$force_full" != "true" ]]; then
            python3 - "$base" "$HEAD_SHA" <<'PY'
          import subprocess
          import sys

          base, head = sys.argv[1:]
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, head]
              ).split(b"\0")
          )
          provenance_helpers = {
              b".github/scripts/reuse-check-from-ancestors.py",
              b".github/scripts/test-reuse-check-from-ancestors.py",
          }
          if changed & provenance_helpers and b".github/workflows/ci.yml" not in changed:
              raise SystemExit(
                  "CI provenance helpers may change only with the protected CI workflow"
              )
          PY
          fi

          if [[ "$force_full" == "true" ]]; then
            output="$(printf '' | .github/scripts/classify-ci-paths.sh "$GITHUB_WORKSPACE" true)"
          else
            output="$(git diff --name-only -z "$base" "$HEAD_SHA" | .github/scripts/classify-ci-paths.sh "$GITHUB_WORKSPACE")"
            # The whole-PR answer is computed FIRST and unconditionally. It used
            # to be skipped entirely whenever a tip-only answer had been set,
            # which is why a pull request touching nine source files could be
            # routed as archive-only.
            if [[ -n "${tip_output:-}" ]]; then
              full_file="$(mktemp)"; tip_file="$(mktemp)"
              printf '%s\n' "$output" >"$full_file"
              printf '%s\n' "$tip_output" >"$tip_file"
              output="$(.github/scripts/select-ci-lane.sh "$full_file" "$tip_file")"
              rm -f "$full_file" "$tip_file"
            fi
          fi

          printf '%s\n' "$output" | tee -a "$GITHUB_OUTPUT"
      - name: Test lifecycle CI routing
        run: |
          .github/scripts/test-classify-ci-paths.sh
          python3 .github/scripts/test-validate-release-candidate.py

  preflight:
    name: Lifecycle preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Every failing pull request this cycle failed for one reason: a change
      # merged before it was finalized stayed active, and its verification
      # commit stopped being an ancestor of HEAD. `trust` spent 9m31s, `test`
      # 3m56s and `audit` 3m08s reaching a verdict available in 4 seconds.
      #
      # Ancestry is decidable with git alone, so this needs no Rust toolchain.
      # It is deliberately a fast FAIL and never a fast pass: anything it cannot
      # decide with certainty is left to `change audit --strict` below.
      - name: Reject stale verification evidence
        # GitHub's default shell is `bash --noprofile --norc -eo pipefail {0}`,
        # so errexit is already on and the body cannot turn it off. This step
        # owns its exit status, and a crash reading one evidence file must skip
        # that file rather than fail the build silently.
        shell: bash {0}
        run: |
          set -uo pipefail
          stale=0
          shopt -s nullglob
          for dir in .specsync/changes/*/; do
            evidence="${dir}verification.json"
            [ -f "$evidence" ] || continue
            commit=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('$evidence'))
              c = d.get('commit') if isinstance(d, dict) else None
          except Exception:
              c = None
          print(c if isinstance(c, str) and len(c) == 40 else '')
          " 2>/dev/null)
            [ -n "$commit" ] || continue
            # fetch-depth: 0 above means every commit reachable from this ref is
            # present. Absence is orphaned evidence (squash merge of an
            # unfinalized change, or a force-push/rebase/amend that dropped the
            # recorded tip). Either way the active change must be re-checked.
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "::error::${dir%/} verification commit ${commit:0:8} is not in this repository — re-run 'specsync change check' (evidence was orphaned by a squash merge, rebase, amend, or force-push)" >&2
              stale=1
              continue
            fi
            if ! git merge-base --is-ancestor "$commit" HEAD 2>/dev/null; then
              echo "::error::${dir%/} verification commit ${commit:0:8} is not an ancestor of HEAD — re-run 'specsync change check' then review and finalize before merging" >&2
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "Run 'specsync change check <ID>' then review and finalize before merging." >&2
            exit 1
          fi
          echo "No stale verification evidence."

  lifecycle-gate:
    name: Lifecycle gate
    needs: [classify, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Build specsync
        run: cargo build
      # Authoritative: validates evidence freshness, canonical ownership and
      # delta coverage without executing verification_commands.
      - name: Audit the lifecycle
        run: cargo run --quiet -- change audit --strict

  test:
    needs: [classify, lifecycle-gate]
    if: needs.classify.outputs.full == 'true'
    # Ordinary development has one authoritative integration platform. The
    # immutable release-candidate workflow qualifies the exact candidate SHA on
    # Ubuntu, macOS, and Windows before any final tag can be created.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo clippy -- -D warnings

  fmt:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  audit:
    needs: [classify, lifecycle-gate]
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run security audit
        run: cargo audit

  coverage:
    needs: [classify, lifecycle-gate]
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --version 0.35.2 --locked --no-default-features
      - name: Run coverage
        # Ptrace can abort this special-file/process-spawning suite with
        # munmap/ECHILD failures. LLVM instrumentation preserves the full test
        # set and 50% gate without relying on ptrace trap delivery.
        #
        # Instruments the BINARY target's own test modules only (2299 tests),
        # deliberately. `specsync` is a `[[bin]]` crate with no `[lib]`, so the
        # unit tests live in the binary target and `--lib` selects nothing.
        #
        # `--follow-exec` over the integration suite produced ~1000 profraw
        # files — measured 999 and 994 — because nearly every integration test
        # spawns the binary as a subprocess, and each child wrote its own
        # profile. Merging that many in one pass killed the runner on every
        # run, always at "Merging coverage reports" and never during the tests,
        # which passed first every time (#624). Naming cannot be overridden
        # from here: tarpaulin sets LLVM_PROFILE_FILE per child itself.
        #
        # The integration suite still RUNS, in the `test` job. It is simply not
        # coverage-instrumented, because instrumenting a suite whose work
        # happens in hundreds of short-lived child processes is what cannot be
        # merged on a 16 GB runner. Coverage therefore reports what the unit
        # tests reach, which is where the measurable logic lives.
        run: >-
          cargo tarpaulin
          --engine llvm
          --bins
          --skip-clean
          --fail-under 50
          --
          --test-threads 1

  site:
    needs: classify
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Run site tests
        working-directory: site
        run: bun test
      - name: Lint site
        working-directory: site
        run: bun run lint
      - name: Build site
        working-directory: site
        run: bun run build

  vscode-extension:
    needs: classify
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        working-directory: vscode-extension
        run: bun install --frozen-lockfile
      - name: Compile extension
        working-directory: vscode-extension
        run: bun run compile
      - name: Package extension
        working-directory: vscode-extension
        run: bun run package

  validate-action:
    needs: classify
    if: needs.classify.outputs.archive_only != 'true' && needs.classify.outputs.review_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate pinned workflow runtimes
        run: python3 .github/scripts/validate-workflow-runtime-pins.py
      - name: Validate release version consistency
        run: python3 .github/scripts/validate-release-version.py

  action-consumer:
    name: Packaged GitHub Action consumer
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Build release archive and clean consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release

          release_dir="${RUNNER_TEMP}/release"
          consumer_dir="${RUNNER_TEMP}/consumer"
          mkdir -p "$release_dir" "$consumer_dir"
          cp target/release/specsync "$release_dir/specsync-linux-x86_64"
          chmod +x "$release_dir/specsync-linux-x86_64"
          tar czf "$release_dir/specsync-linux-x86_64.tar.gz" \
            -C "$release_dir" specsync-linux-x86_64
          (
            cd "$release_dir"
            shasum -a 256 specsync-linux-x86_64.tar.gz \
              > specsync-linux-x86_64.tar.gz.sha256
          )

          git -C "$consumer_dir" init -b main
          git -C "$consumer_dir" config user.email action-consumer@specsync.dev
          git -C "$consumer_dir" config user.name "SpecSync Action Consumer"
          (
            cd "$consumer_dir"
            "$GITHUB_WORKSPACE/target/release/specsync" init
            mkdir -p src specs/greeting
            printf 'pub fn hello() {}\n' > src/greeting.rs
            printf '%s\n' \
              '---' \
              'module: greeting' \
              'version: 1' \
              'status: stable' \
              'files:' \
              '  - src/greeting.rs' \
              '---' \
              '' \
              '# Greeting' \
              '' \
              '## Purpose' \
              '' \
              'Provides a greeting.' \
              '' \
              '## Public API' \
              '' \
              '| Name | Description |' \
              '|------|-------------|' \
              "| \`hello\` | Return a greeting |" \
              '' \
              '## Invariants' \
              '' \
              '1. Greeting behavior remains stable.' \
              '' \
              '## Behavioral Examples' \
              '' \
              'Calling hello succeeds.' \
              '' \
              '## Error Cases' \
              '' \
              'None.' \
              '' \
              '## Dependencies' \
              '' \
              'None.' \
              '' \
              '## Change Log' \
              '' \
              '| Date | Change |' \
              '|------|--------|' \
              '| 2026-07-10 | Initial consumer fixture |' \
              > specs/greeting/greeting.spec.md
            git add .
            git commit -m "Initialize clean consumer"
          )

          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory "$release_dir" >"${RUNNER_TEMP}/specsync-release-server.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/specsync-release-server.pid"
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/specsync-linux-x86_64.tar.gz.sha256 >/dev/null; then
              exit 0
            fi
            echo "Release server not ready (attempt ${attempt}/5)"
            sleep 1
          done
          exit 1
      - name: Run the packaged action in the clean consumer
        uses: ./
        with:
          version: '6.0.0'
          download-base-url: 'http://127.0.0.1:8765'
          root: ${{ runner.temp }}/consumer
          strict: 'true'
          require-coverage: '100'
          lifecycle-enforce: 'true'

  spec-check:
    needs: [classify, lifecycle-gate]
    if: needs.classify.outputs.archive_only != 'true' && needs.classify.outputs.review_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      body: ${{ steps.spec-check.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Build specsync
        run: cargo build
      - name: Run spec-check
        id: spec-check
        run: |
          # Generate rich comment body for corvid-pet context
          BODY=$(cargo run --quiet -- comment 2>/dev/null) || true
          # `specsync comment` is bounded, and this second cap protects the
          # action input if an older or unexpected binary is invoked here.
          BODY=$(printf '%s' "$BODY" | python3 -c 'import sys; data = sys.stdin.buffer.read(); limit = 49152; sys.stdout.write(data[:limit].decode("utf-8", "ignore"))')
          echo "$BODY"
          write_multiline_output() {
            local name="$1" value="$2" delimiter
            while true; do
              delimiter="SPECSYNC_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
              if ! printf '%s\n' "$value" | grep -Fqx "$delimiter"; then
                break
              fi
            done
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }
          write_multiline_output body "$BODY"
          # Fail the step if check fails
          cargo run -- check --strict --require-coverage 100 --force

      # SpecSync is the single authority on lifecycle coherence. This replaces
      # the archive-integrity, archive-introduction, and post-merge-binding
      # validators that previously reimplemented these rules against commit
      # topology.
      - name: Audit lifecycle coherence
        run: cargo run -- change audit --strict

  implementation-gate:
    name: SpecSync implementation ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [classify, test, fmt, validate-action, action-consumer, spec-check, audit, coverage, site, vscode-extension, corvid-pet]
    steps:
      - name: Require every selected gate
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "Selected CI gate ended with: $result" >&2; exit 1 ;;
            esac
          done

  ci-gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [classify, implementation-gate]
    steps:
      # One aggregate context, suitable for a required status check. Lifecycle
      # coherence is proven by `specsync change audit --strict` in spec-check,
      # not by inspecting commit topology.
      - name: Require the implementation gate
        env:
          IMPLEMENTATION_RESULT: ${{ needs.implementation-gate.result }}
        run: |
          if [[ "$IMPLEMENTATION_RESULT" != "success" ]]; then
            echo "Implementation gate ended with: $IMPLEMENTATION_RESULT" >&2
            exit 1
          fi

  corvid-pet:
    name: SpecSync scoped review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the one independent, implementation-scoped review. A proven
    # archive-only child reuses the green result on its parent and never runs
    # the reviewer a second time. Forks run the same read-only review without
    # attempting a comment or review write.
    if: ${{ always() && github.event_name == 'pull_request' && needs.classify.outputs.review_required == 'true' }}
    needs: [classify, preflight, lifecycle-gate, test, fmt, validate-action, action-consumer, spec-check, audit, coverage, site, vscode-extension]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine combined status
        id: status
        env:
          CHECK_TEST: "Tests (build, test, clippy)=${{ needs.test.result }}"
          CHECK_FMT: "Format Check=${{ needs.fmt.result }}"
          CHECK_ACTION: "Validate action.yml=${{ needs.validate-action.result }}"
          CHECK_ACTION_CONSUMER: "Packaged Action Consumer=${{ needs.action-consumer.result }}"
          CHECK_SPEC: "Spec Validation=${{ needs.spec-check.result }}"
          CHECK_AUDIT: "Dependency Audit=${{ needs.audit.result }}"
          CHECK_COVERAGE: "Code Coverage=${{ needs.coverage.result }}"
          CHECK_SITE: "Docs Site=${{ needs.site.result }}"
          CHECK_VSCODE: "VS Code Extension=${{ needs.vscode-extension.result }}"
          REPORT_SPEC: ${{ needs.spec-check.outputs.body }}
        run: |
          OVERALL="success"
          TABLE="| Check | Status |\n|-------|--------|\n"
          DETAILS=""

          while IFS= read -r line; do
            VAR_NAME="${line%%=*}"
            VAR_VALUE="${!VAR_NAME}"
            LABEL="${VAR_VALUE%%=*}"
            RESULT="${VAR_VALUE##*=}"

            if [ "$RESULT" = "success" ]; then
              ICON="✅ Passed"
            elif [ "$RESULT" = "skipped" ]; then
              ICON="⏭️ Not selected"
            else
              ICON="❌ ${RESULT}"
              OVERALL="failure"
            fi
            TABLE+="| **${LABEL}** | ${ICON} |\n"

            SUFFIX="${VAR_NAME#CHECK_}"
            REPORT_VAR="REPORT_${SUFFIX}"
            REPORT_VALUE="${!REPORT_VAR}"
            if [ -n "$REPORT_VALUE" ]; then
              DETAILS+="\n<details>\n<summary>📋 ${LABEL} Details</summary>\n\n${REPORT_VALUE}\n\n</details>\n"
            fi
          done < <(env | grep '^CHECK_' | sort)

          echo "result=${OVERALL}" >> "$GITHUB_OUTPUT"
          CONTEXT=$(printf '### CI Summary\n\n%b' "$TABLE")
          if [ -n "$DETAILS" ]; then
            CONTEXT+=$(printf '%b' "$DETAILS")
          fi
          write_multiline_output() {
            local name="$1" value="$2" delimiter
            while true; do
              delimiter="SPECSYNC_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
              if ! printf '%s\n' "$value" | grep -Fqx "$delimiter"; then
                break
              fi
            done
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }
          write_multiline_output context "$CONTEXT"

      - uses: CorvidLabs/corvid-pet@v1.0.0
        with:
          mode: pr-comment
          event: auto
          pet-name: Corvin
          comment-on-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
          review-on-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
          context: ${{ steps.status.outputs.context }}
          job-status: ${{ steps.status.outputs.result }}

  attest:
    name: Record attestation
    runs-on: ubuntu-latest
    # Depend on every gate job, not just a subset: an attestation records
    # "proceed", so it must not sign off on a commit where any real check failed.
    # (corvid-pet is a same-repository PR mascot, not a gate, so it is intentionally out.)
    needs: [ci-gate]
    if: needs.ci-gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # contents: write lets the step push refs/notes/attest.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # After the gates pass, record a provenance attestation on this commit and
      # push it to refs/notes/attest, so spec-sync builds a trust ledger (and its
      # /trust/ attest pip lights). attest ships a public Linux binary
      # (checksum-verified), so no token is needed; the step is additive and
      # best-effort, so a hiccup logs a warning and never fails CI.
      - name: Record attestation (attest)
        env:
          ATTEST_VERSION: v0.5.0
        run: |
          base="https://github.com/CorvidLabs/attest/releases/download/${ATTEST_VERSION}"
          bin="${RUNNER_TEMP}/attest"; sum="${bin}.sha256"
          retry=(--retry 5 --retry-connrefused --retry-delay 1)
          if curl -fsSL "${retry[@]}" "${base}/attest-linux-x86_64" -o "$bin" \
            && curl -fsSL "${retry[@]}" "${base}/attest-linux-x86_64.sha256" -o "$sum" \
            && want="$(awk '{print $1}' "$sum")" && [ -n "$want" ] \
            && printf '%s  %s\n' "$want" "$bin" | sha256sum -c - ; then
            chmod +x "$bin"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git fetch origin "+refs/notes/attest:refs/notes/attest" 2>/dev/null || true
            if "$bin" sign --commit HEAD --reviewer agent:ci --confidence 0.9 --tests-passed \
                 --verdict proceed --note "Selected path-aware CI gates passed" \
               && git push origin refs/notes/attest ; then
              echo "attestation recorded for $(git rev-parse --short HEAD)"
            else
              echo "::warning::attest sign/push failed; provenance not recorded this run"
            fi
          else
            echo "::warning::attest download/verify failed; provenance not recorded this run"
          fi
