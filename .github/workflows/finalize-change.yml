name: Archive-only finalization guard

on:
  workflow_call:
    inputs:
      head_sha:
        description: Finalization child commit to validate
        required: true
        type: string
      change_id:
        description: Exact active change ID moved by the child commit
        required: true
        type: string
      archive_dir:
        description: Exact dated archive directory created by the child commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    name: Validate archive-only finalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Prove the finalization child shape
        id: child
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_CHANGE_ID: ${{ inputs.change_id }}
          EXPECTED_ARCHIVE_DIR: ${{ inputs.archive_dir }}
        shell: bash
        run: |
          set -euo pipefail

          parent_line="$(git rev-list --parents -n 1 "$HEAD_SHA")"
          if [[ "$(wc -w <<<"$parent_line" | tr -d ' ')" != "2" ]]; then
            echo "Archive-only finalization must be a single-parent child commit." >&2
            exit 1
          fi

          parent_sha="$(git rev-parse "$HEAD_SHA^")"
          output="$(
            git diff --name-status -z -M "$parent_sha" "$HEAD_SHA" \
              | .github/scripts/classify-ci-paths.sh \
                  "$GITHUB_WORKSPACE" false name-status "$parent_sha"
          )"
          printf '%s\n' "$output"

          archive_only="$(sed -n 's/^archive_only=//p' <<<"$output")"
          change_id="$(sed -n 's/^archive_change_id=//p' <<<"$output")"
          archive_dir="$(sed -n 's/^archive_dir=//p' <<<"$output")"
          if [[ "$archive_only" != "true" \
              || "$change_id" != "$EXPECTED_CHANGE_ID" \
              || "$archive_dir" != "$EXPECTED_ARCHIVE_DIR" ]]; then
            echo "The child commit is not the exact approved change-to-archive move." >&2
            exit 1
          fi

          {
            printf 'parent_sha=%s\n' "$parent_sha"
            printf 'parent_tree=%s\n' "$(git rev-parse "$parent_sha^{tree}")"
          } >> "$GITHUB_OUTPUT"

      - name: Require base-trusted lifecycle policy (parent or product ancestor)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PARENT_SHA: ${{ steps.child.outputs.parent_sha }}
          GIT_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # Exact parent first, then first-parent ancestors (product tip).
          # Prevents cancel-poison when review/archive tips move PR head.
          errors=""
          previous=""
          while IFS= read -r sha; do
            if [[ -n "$previous" ]]; then
              if ! python3 .github/scripts/reuse-check-from-ancestors.py \
                  --check-metadata-edge "$sha" "$previous"; then
                echo "Trusted-policy ancestry stopped before $previous." >&2
                break
              fi
            fi
            if HEAD_SHA="$sha" python3 .github/scripts/verify-trusted-policy-check.py; then
              echo "Trusted policy verified for candidate $sha"
              exit 0
            fi
            errors="${errors} ${sha}"
            previous="$sha"
          done < <(git rev-list --first-parent -n 32 "${PARENT_SHA}")
          echo "Trusted policy not reusable for parent chain:${errors}" >&2
          exit 1

      - name: Require green checks on the implementation parent (ancestor-aware)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PARENT_SHA: ${{ steps.child.outputs.parent_sha }}
          CHANGE_ID: ${{ inputs.change_id }}
          GIT_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # Walk first-parent ancestors so review/archive tips can reuse product-tip
          # provenance (fixes multi-tip ship thrash / "tip dance").
          export START_SHA="${PARENT_SHA}"
          export CHILD_KIND="archive"
          export MAX_ANCESTORS=32

          export OUTPUT_FORMAT=env
          export CHECK_NAME="SpecSync implementation ready"
          export WORKFLOW_PATH=".github/workflows/ci.yml"
          export REQUIRE_RUN_SUCCESS="false"
          implementation="$(python3 .github/scripts/reuse-check-from-ancestors.py)"

          export CHECK_NAME="SpecSync scoped review"
          export WORKFLOW_PATH=".github/workflows/ci.yml"
          export REQUIRE_RUN_SUCCESS="false"
          review="$(python3 .github/scripts/reuse-check-from-ancestors.py)"

          export CHECK_NAME="trust"
          export WORKFLOW_PATH=".github/workflows/trust.yml"
          export REQUIRE_RUN_SUCCESS="true"
          trust="$(python3 .github/scripts/reuse-check-from-ancestors.py)"

          implementation_ancestor="$(sed -n 's/^ancestor_sha=//p' <<<"$implementation")"
          implementation_run="$(sed -n 's/^workflow_run_id=//p' <<<"$implementation")"
          review_ancestor="$(sed -n 's/^ancestor_sha=//p' <<<"$review")"
          review_run="$(sed -n 's/^workflow_run_id=//p' <<<"$review")"
          trust_ancestor="$(sed -n 's/^ancestor_sha=//p' <<<"$trust")"
          if [[ -z "$implementation_ancestor" \
              || "$implementation_ancestor" != "$review_ancestor" \
              || "$implementation_ancestor" != "$trust_ancestor" \
              || "$implementation_run" != "$review_run" ]]; then
            echo "Required checks do not share one product ancestor and CI run." >&2
            exit 1
          fi

          echo "Implementation-parent provenance green at ${implementation_ancestor}."

      - name: Validate archive integrity and parent binding
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          PARENT_SHA: ${{ steps.child.outputs.parent_sha }}
          PARENT_TREE: ${{ steps.child.outputs.parent_tree }}
          CHANGE_ID: ${{ inputs.change_id }}
          ARCHIVE_DIR: ${{ inputs.archive_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import selectors
          import subprocess
          import time

          head = os.environ["HEAD_SHA"]
          parent = os.environ["PARENT_SHA"]
          parent_tree = os.environ["PARENT_TREE"]
          change_id = os.environ["CHANGE_ID"]
          archive_dir = os.environ["ARCHIVE_DIR"]
          active = f".specsync/changes/{change_id}"
          archive = f".specsync/archive/changes/{archive_dir}"
          with open(
              ".github/scripts/lifecycle-validation-limits.json",
              encoding="utf-8",
          ) as handle:
              limits = json.load(handle)
          max_git_output_bytes = int(limits["git_max_output_bytes"])
          git_timeout_seconds = int(limits["git_timeout_seconds"])
          max_review_descendants = int(limits["scoped_review_max_descendants"])
          max_review_parents = int(limits["scoped_review_max_parents"])
          if min(
              max_git_output_bytes,
              git_timeout_seconds,
              max_review_descendants,
              max_review_parents,
          ) <= 0:
              raise SystemExit("lifecycle validation limits must be positive")

          def git_bytes(*args: str) -> bytes:
              process = subprocess.Popen(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if process.stdout is None or process.stderr is None:
                  process.kill()
                  raise SystemExit("failed to capture bounded git query")
              selector = selectors.DefaultSelector()
              selector.register(process.stdout, selectors.EVENT_READ, "stdout")
              selector.register(process.stderr, selectors.EVENT_READ, "stderr")
              stdout = bytearray()
              stderr = bytearray()
              total_output = 0
              deadline = time.monotonic() + git_timeout_seconds
              try:
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          process.kill()
                          process.wait()
                          raise SystemExit(
                              f"bounded git query timed out: {' '.join(args)}"
                          )
                      events = selector.select(timeout=remaining)
                      if not events:
                          continue
                      for key, _ in events:
                          chunk = os.read(key.fileobj.fileno(), 64 * 1024)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          total_output += len(chunk)
                          if total_output > max_git_output_bytes:
                              process.kill()
                              process.wait()
                              raise SystemExit(
                                  "bounded git query exceeded "
                                  f"{max_git_output_bytes} bytes: {' '.join(args)}"
                              )
                          if key.data == "stdout":
                              stdout.extend(chunk)
                          elif len(stderr) < 4096:
                              stderr.extend(chunk[:4096 - len(stderr)])
                  returncode = process.wait(timeout=5)
              finally:
                  selector.close()
                  if process.poll() is None:
                      process.kill()
                      process.wait()
              if returncode != 0:
                  detail = bytes(stderr).decode(errors="replace").strip()
                  raise SystemExit(
                      f"git {' '.join(args)} failed ({returncode}): {detail}"
                  )
              return bytes(stdout)

          def git_status(*args: str) -> int:
              try:
                  return subprocess.run(
                      ["git", *args],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                      timeout=git_timeout_seconds,
                  ).returncode
              except subprocess.TimeoutExpired as error:
                  raise SystemExit(
                      f"bounded git status query timed out: {' '.join(args)}"
                  ) from error

          def git(*args: str) -> str:
              return git_bytes(*args).decode().strip()

          def exists(commit: str, path: str) -> bool:
              return git_status("cat-file", "-e", f"{commit}:{path}") == 0

          def files(commit: str, prefix: str) -> list[str]:
              output = git("ls-tree", "-r", "--name-only", commit, "--", prefix)
              return [line for line in output.splitlines() if line]

          def valid_reviewer_claim(value: object) -> bool:
              return (
                  isinstance(value, str)
                  and 1 <= len(value) <= 128
                  and value.isascii()
                  and re.fullmatch(r"[A-Za-z0-9 ._:@/-]+", value) is not None
              )

          if not exists(parent, active):
              raise SystemExit("implementation parent does not contain the active change")
          if exists(head, active):
              raise SystemExit("finalization child still contains the active change")
          if exists(parent, archive):
              raise SystemExit("dated archive already existed on the implementation parent")
          if not exists(head, archive):
              raise SystemExit("finalization child does not contain the dated archive")

          active_files = files(parent, active)
          archive_files = files(head, archive)
          if not active_files or not archive_files:
              raise SystemExit("active or archived change package is empty")

          active_rel = {path.removeprefix(active + "/") for path in active_files}
          archive_rel = {path.removeprefix(archive + "/") for path in archive_files}
          missing = sorted(active_rel - archive_rel)
          if missing:
              raise SystemExit(
                  "archive dropped active change files: " + ", ".join(missing)
              )

          expected_extras = {"accepted-state.json", "finalization.json"}
          if "review.json" not in active_rel:
              # The plain newcomer path records review and immediately
              # finalizes. Repositories may still persist review.json in its
              # own metadata-only child before finalization.
              expected_extras.add("review.json")
              expected_extras.add("review-attempts.json")
          actual_extras = archive_rel - active_rel
          if actual_extras != expected_extras:
              raise SystemExit(
                  "archive terminal files do not match the generated set: "
                  f"expected {sorted(expected_extras)}, got {sorted(actual_extras)}"
              )

          terminal_mutations = {
              "change.md",
              "state.json",
              "verification-attempts.json",
              "verification.json",
          }
          for relative in sorted(active_rel - terminal_mutations):
              before = git("rev-parse", f"{parent}:{active}/{relative}")
              after = git("rev-parse", f"{head}:{archive}/{relative}")
              if before != after:
                  raise SystemExit(
                      f"archive-only child rewrote immutable change evidence: {relative}"
                  )

          required_files = {
              "accepted-state.json",
              "approvals.json",
              "change.md",
              "finalization.json",
              "review.json",
              "review-attempts.json",
              "state.json",
              "verification-attempts.json",
              "verification.json",
          }
          absent = sorted(required_files - archive_rel)
          if absent:
              raise SystemExit(
                  "archive is missing required evidence: " + ", ".join(absent)
              )

          parent_state = json.loads(git("show", f"{parent}:{active}/state.json"))
          accepted_state = json.loads(
              git("show", f"{head}:{archive}/accepted-state.json")
          )
          state = json.loads(git("show", f"{head}:{archive}/state.json"))
          for label, value, expected_state in (
              ("parent", parent_state, "verifying"),
              ("accepted snapshot", accepted_state, "accepted"),
              ("archive", state, "archived"),
          ):
              if value.get("id") != change_id or value.get("state") != expected_state:
                  raise SystemExit(
                      f"{label} state does not identify {expected_state} {change_id}"
                  )
              if value.get("workflow_version") != 2:
                  raise SystemExit(
                      f"{label} state is not a workflow_version=2 change"
                  )

          def equal_except(
              left: dict,
              right: dict,
              exceptions: set[str],
          ) -> bool:
              return {
                  key: value for key, value in left.items() if key not in exceptions
              } == {
                  key: value for key, value in right.items() if key not in exceptions
              } and (set(left) - exceptions) == (set(right) - exceptions)

          if not equal_except(parent_state, accepted_state, {"state", "updated_at"}):
              raise SystemExit(
                  "accepted-state.json is not the exact accepted projection of the "
                  "verifying parent state"
              )
          if not equal_except(accepted_state, state, {"state", "updated_at"}):
              raise SystemExit(
                  "archived state.json differs from accepted-state.json beyond "
                  "state and updated_at"
              )

          parent_markdown = git_bytes("show", f"{parent}:{active}/change.md")
          archived_markdown = git_bytes("show", f"{head}:{archive}/change.md")
          marker = b"\n---\n"
          if not parent_markdown.startswith(b"---\n") or marker not in parent_markdown:
              raise SystemExit("parent change.md has no generated YAML frontmatter")
          frontmatter_end = parent_markdown.index(marker)
          frontmatter = parent_markdown[:frontmatter_end]
          state_line = b"\nstate: verifying\n"
          if frontmatter.count(state_line) != 1:
              raise SystemExit(
                  "parent change.md does not have one generated verifying state line"
              )
          expected_markdown = parent_markdown.replace(
              state_line,
              b"\nstate: archived\n",
              1,
          )
          if archived_markdown != expected_markdown:
              raise SystemExit(
                  "change.md changed beyond the exact generated "
                  "verifying-to-archived frontmatter transition"
              )

          parent_verification = json.loads(
              git("show", f"{parent}:{active}/verification.json")
          )
          verification = json.loads(git("show", f"{head}:{archive}/verification.json"))
          if verification.get("passed") is not True:
              raise SystemExit("archived verification evidence is not passing")
          mutable_verification_fields = {
              "acceptance_input_digest",
              "acceptance_manifest",
              "commit",
              "semantic_succession",
          }
          if not equal_except(
              parent_verification,
              verification,
              mutable_verification_fields,
          ):
              raise SystemExit(
                  "finalization rewrote immutable verification fields"
              )
          verification_commit = verification.get("commit")
          if verification_commit != parent:
              raise SystemExit(
                  "finalized verification is not adopted to the exact implementation parent"
              )
          prior_verification_commit = parent_verification.get("commit")
          if prior_verification_commit != parent:
              if re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(prior_verification_commit or ""),
              ) is None:
                  raise SystemExit(
                      "parent verification has no canonical implementation commit"
                  )
              if git_status(
                  "merge-base",
                  "--is-ancestor",
                  prior_verification_commit,
                  parent,
              ) != 0:
                  raise SystemExit(
                      "parent verification commit is outside implementation history"
                  )
          for field in ("contract_digest", "execution_digest", "workspace_digest"):
              if re.fullmatch(
                  r"[0-9a-f]{64}",
                  str(verification.get(field) or ""),
              ) is None:
                  raise SystemExit(f"verification has an invalid {field}")

          parent_attempts = json.loads(
              git("show", f"{parent}:{active}/verification-attempts.json")
          )
          attempts = json.loads(
              git("show", f"{head}:{archive}/verification-attempts.json")
          )
          if (
              parent_attempts.get("schema_version") != 1
              or attempts.get("schema_version") != 1
              or not isinstance(parent_attempts.get("attempts"), list)
              or not isinstance(attempts.get("attempts"), list)
          ):
              raise SystemExit("verification attempt history has an invalid schema")
          prior_attempts = parent_attempts["attempts"]
          current_attempts = attempts["attempts"]
          if parent_verification.get("commit") == parent:
              if attempts != parent_attempts:
                  raise SystemExit(
                      "finalization rewrote verification attempts without adoption"
                  )
          elif (
              len(current_attempts) != len(prior_attempts) + 1
              or current_attempts[:-1] != prior_attempts
              or current_attempts[-1] != verification
          ):
              raise SystemExit(
                  "finalization did not preserve verification attempts and append "
                  "the exact adopted verification"
              )

          finalization_path = f"{archive}/finalization.json"
          if not exists(head, finalization_path):
              raise SystemExit("archive is missing finalization.json")
          finalization = json.loads(git("show", f"{head}:{finalization_path}"))
          if finalization.get("schema_version") != 2:
              raise SystemExit("finalization evidence has an unsupported schema")
          if finalization.get("change_id") != change_id:
              raise SystemExit("finalization evidence names a different change")
          if finalization.get("implementation_commit") != parent:
              raise SystemExit("finalization evidence is not bound to the exact parent")
          if finalization.get("implementation_tree") != parent_tree:
              raise SystemExit("finalization evidence records the wrong implementation tree")
          if not isinstance(finalization.get("timestamp"), int):
              raise SystemExit("finalization evidence has an invalid timestamp")

          review_path = f"{archive}/review.json"
          review_attempts_path = f"{archive}/review-attempts.json"
          if not exists(head, review_path):
              raise SystemExit("archive is missing independent scoped review evidence")
          if not exists(head, review_attempts_path):
              raise SystemExit("archive is missing append-only scoped review history")
          review = json.loads(git("show", f"{head}:{review_path}"))
          review_attempts = json.loads(git("show", f"{head}:{review_attempts_path}"))
          if review.get("schema_version") != 2 or review.get("change_id") != change_id:
              raise SystemExit("scoped review has the wrong schema or change")
          if (
              review_attempts.get("schema_version") != 1
              or not review_attempts.get("reviews")
              or review_attempts["reviews"][-1] != review
          ):
              raise SystemExit(
                  "scoped-review projection does not match append-only attempt history"
              )
          for attempt in review_attempts["reviews"]:
              if (
                  attempt.get("schema_version") != 2
                  or attempt.get("change_id") != change_id
                  or not valid_reviewer_claim(attempt.get("reviewer"))
                  or attempt.get("provenance") != {
                      "schema_version": 1,
                      "provider": "github_actions_check",
                      "required_check": "SpecSync scoped review",
                  }
              ):
                  raise SystemExit("scoped-review attempt history contains invalid evidence")
          parent_review_attempts_path = f"{active}/review-attempts.json"
          if exists(parent, parent_review_attempts_path):
              parent_review_attempts = json.loads(
                  git("show", f"{parent}:{parent_review_attempts_path}")
              )
              if (
                  parent_review_attempts.get("schema_version") != 1
                  or parent_review_attempts.get("reviews")
                  != review_attempts["reviews"]
              ):
                  raise SystemExit(
                      "finalization removed or rewrote committed scoped-review attempts"
                  )
          if review.get("provenance") != {
              "schema_version": 1,
              "provider": "github_actions_check",
              "required_check": "SpecSync scoped review",
          }:
              raise SystemExit("scoped review has invalid required-check provenance")
          if not valid_reviewer_claim(review.get("reviewer")):
              raise SystemExit("scoped review has an invalid stable reviewer claim")
          if review.get("verdict") != "pass":
              raise SystemExit("scoped review does not record a passing verdict")
          approvals = json.loads(git("show", f"{head}:{archive}/approvals.json"))
          definition_approvals = [
              approval for approval in approvals.get("approvals", [])
              if approval.get("gate") == "definition"
          ]
          if not definition_approvals:
              raise SystemExit("scope approval evidence is missing")
          scope_approver = str(definition_approvals[-1].get("actor") or "").strip()
          if review["reviewer"].strip().casefold() == scope_approver.casefold():
              raise SystemExit("scoped reviewer is not independent from the scope approver")
          reviewed_commit = review.get("implementation_commit")
          if not isinstance(reviewed_commit, str) or not reviewed_commit:
              raise SystemExit("scoped review does not bind an implementation commit")
          if git_status(
              "merge-base",
              "--is-ancestor",
              reviewed_commit,
              parent,
          ) != 0:
              raise SystemExit("scoped review commit is outside the implementation history")
          allowed_review_descendants = {
              f"{active}/review.json",
              f"{active}/review-attempts.json",
              f"{active}/state.json",
              f"{active}/verification.json",
              f"{active}/verification-attempts.json",
          }
          descendants = git(
              "rev-list",
              "--reverse",
              f"--max-count={max_review_descendants + 1}",
              f"{reviewed_commit}..{parent}",
          ).splitlines()
          if len(descendants) > max_review_descendants:
              raise SystemExit(
                  "scoped-review descendant history exceeds the bounded validation limit"
              )
          for descendant in descendants:
              fields = git(
                  "rev-list",
                  "--parents",
                  "-n",
                  "1",
                  descendant,
              ).split()
              if not fields or fields[0] != descendant or len(fields) < 2:
                  raise SystemExit(
                      f"scoped-review descendant {descendant} has ambiguous parents"
                  )
              if len(fields) - 1 > max_review_parents:
                  raise SystemExit(
                      f"scoped-review descendant {descendant} exceeds the parent limit"
                  )
              for ancestor in fields[1:]:
                  paths = git_bytes(
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "--no-renames",
                      "-z",
                      "-r",
                      ancestor,
                      descendant,
                  ).decode().split("\0")
                  unexpected = sorted(
                      path for path in paths
                      if path and path not in allowed_review_descendants
                  )
                  if unexpected:
                      raise SystemExit(
                          "implementation changed after scoped review: "
                          + ", ".join(unexpected)
                      )

          for field in ("contract_digest", "workspace_digest"):
              if finalization.get(field) != verification.get(field):
                  raise SystemExit(f"finalization {field} does not match verification")
          for field in ("contract_digest", "execution_digest", "workspace_digest"):
              if review.get(field) != verification.get(field):
                  raise SystemExit(f"scoped review {field} does not match verification")

          canonical_review = {
              "schema_version": review["schema_version"],
              "change_id": review["change_id"],
              "reviewer": review["reviewer"],
              "provenance": review["provenance"],
              "verdict": review["verdict"],
              "implementation_commit": review["implementation_commit"],
              "contract_digest": review["contract_digest"],
              "execution_digest": review["execution_digest"],
              "workspace_digest": review["workspace_digest"],
              "timestamp": review["timestamp"],
          }
          review_bytes = json.dumps(
              canonical_review,
              ensure_ascii=False,
              separators=(",", ":"),
          ).encode()
          review_digest = hashlib.sha256(review_bytes).hexdigest()
          if finalization.get("review_digest") != review_digest:
              raise SystemExit("finalization review digest does not match review.json")

          def frame(hasher, tag: str, value) -> None:
              tag_bytes = tag.encode()
              value_bytes = value if isinstance(value, bytes) else value.encode()
              hasher.update(len(tag_bytes).to_bytes(8, "big"))
              hasher.update(tag_bytes)
              hasher.update(len(value_bytes).to_bytes(8, "big"))
              hasher.update(value_bytes)

          def succession_digest(evidence: dict) -> str:
              succession = hashlib.sha256()
              frame(
                  succession,
                  "domain",
                  "specsync.semantic-succession.v1",
              )
              schema_version = evidence.get("schema_version")
              if not isinstance(schema_version, int):
                  raise SystemExit(
                      "semantic succession evidence has no schema version"
                  )
              frame(
                  succession,
                  "schema-version",
                  schema_version.to_bytes(4, "big"),
              )
              tuples = evidence.get("tuples")
              if not isinstance(tuples, list):
                  raise SystemExit("semantic succession evidence has no tuples")
              for item in tuples:
                  frame(succession, "tuple", b"")
                  for tag, field in (
                      ("predecessor-id", "predecessor_id"),
                      ("path", "path"),
                      ("module", "module"),
                      ("predecessor-entry-digest", "predecessor_entry_digest"),
                      ("successor-entry-digest", "successor_entry_digest"),
                  ):
                      value = item.get(field)
                      if not isinstance(value, str):
                          raise SystemExit(
                              f"semantic succession tuple has no {field}"
                          )
                      frame(succession, tag, value)
              return succession.hexdigest()

          closing = hashlib.sha256()
          frame(closing, "domain", "specsync.closing-digest.v2")
          frame(closing, "record-id", change_id)
          frame(closing, "contract", verification["contract_digest"])
          frame(closing, "execution", verification["execution_digest"])
          frame(closing, "workspace", verification["workspace_digest"])
          frame(closing, "commit", verification.get("commit") or "")
          acceptance_digest = verification.get("acceptance_input_digest")
          if acceptance_digest is None:
              frame(closing, "acceptance", b"\x00")
          elif isinstance(acceptance_digest, str):
              frame(
                  closing,
                  "acceptance",
                  b"\x01" + acceptance_digest.encode(),
              )
          else:
              raise SystemExit("verification has an invalid acceptance input digest")
          manifest = verification.get("acceptance_manifest")
          if manifest is not None:
              entries = manifest.get("entries")
              if not isinstance(entries, list):
                  raise SystemExit("verification has an invalid acceptance manifest")
              canonical_manifest = {
                  "schema_version": manifest.get("schema_version"),
                  "entries": [
                      {
                          "path": entry.get("path"),
                          "kind": entry.get("kind"),
                          "mode": entry.get("mode"),
                          "payload_digest": entry.get("payload_digest"),
                          "entry_digest": entry.get("entry_digest"),
                          "owners": entry.get("owners"),
                      }
                      for entry in entries
                  ],
              }
              manifest_bytes = json.dumps(
                  canonical_manifest,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode()
              frame(
                  closing,
                  "acceptance-input-manifest-v1",
                  manifest_bytes,
              )
          succession = verification.get("semantic_succession")
          if succession is not None:
              frame(
                  closing,
                  "semantic-succession-v1",
                  succession_digest(succession),
              )
          closing_digest = closing.hexdigest()
          if finalization.get("closing_digest") != closing_digest:
              raise SystemExit(
                  "finalization closing digest does not match verification evidence"
              )

          digest = hashlib.sha256()
          frame(digest, "domain", "specsync.finalization-digest.v2")
          frame(digest, "change-id", finalization["change_id"])
          frame(
              digest,
              "implementation-commit",
              finalization["implementation_commit"],
          )
          frame(
              digest,
              "implementation-tree",
              finalization["implementation_tree"],
          )
          frame(digest, "contract", finalization["contract_digest"])
          frame(digest, "workspace", finalization["workspace_digest"])
          frame(digest, "closing", finalization["closing_digest"])
          frame(digest, "review", finalization["review_digest"])
          if finalization.get("finalization_digest") != digest.hexdigest():
              raise SystemExit("finalization digest does not match its bound evidence")

          print(
              f"Validated {change_id}: parent {parent} -> archive {archive_dir}; "
              "verification history is append-only and non-terminal evidence is unchanged."
          )
          PY

          {
            echo "### Archive-only finalization"
            echo
            echo "- Change: \`${CHANGE_ID}\`"
            echo "- Implementation parent: \`${PARENT_SHA}\`"
            echo "- Implementation tree: \`${PARENT_TREE}\`"
            echo "- Archive: \`.specsync/archive/changes/${ARCHIVE_DIR}/\`"
            echo "- Result: parent checks green; exact archive move and integrity verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Run native archived-evidence validation
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- check --strict --require-coverage 100 --force
