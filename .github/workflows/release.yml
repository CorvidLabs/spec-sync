name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable annotated RC tag to promote after qualification
        required: true
        type: string
      dry_run:
        description: >-
          Resolve the candidate and run validation only. Creates no tag and
          publishes nothing. Every other job is gated on qualify/promote and
          skips.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: specsync-release-${{ inputs.rc_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      rc_tag: ${{ steps.resolve.outputs.rc_tag }}
      final_tag: ${{ steps.resolve.outputs.final_tag }}
      version: ${{ steps.resolve.outputs.version }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve immutable release candidate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_RC_TAG: ${{ inputs.rc_tag }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_FORCED: ${{ github.event.forced }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected_workflow_ref="${REPOSITORY}/.github/workflows/release.yml@refs/heads/${DEFAULT_BRANCH}"
            if [[ "$WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
              echo "::error::Promotion must be dispatched from ${DEFAULT_BRANCH}"
              exit 1
            fi
            # A dry run resolves the candidate and validates it, then stops.
            # Every job below `validate` is gated on qualify/promote, so none
            # of them run and no tag is created. This exists so `release.yml`
            # can be executed at all without pushing a tag — the lane going
            # unexercised for sixteen days is how #635 stayed invisible.
            # Reject anything that is not exactly true/false rather than
            # falling back to a default. Treating an unrecognized value as
            # "not a dry run" would turn a typo into a real promotion.
            case "${REQUESTED_DRY_RUN:-false}" in
              true) mode="dry-run" ;;
              false|"") mode="promote" ;;
              *)
                echo "::error::dry_run must be true or false, got '${REQUESTED_DRY_RUN}'"
                exit 1
                ;;
            esac
            rc_tag="$REQUESTED_RC_TAG"
            git fetch --force origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
          elif [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            mode="qualify"
            rc_tag="$REF_NAME"
            if [[ "$PUSH_CREATED" != "true" || "$PUSH_FORCED" == "true" ]]; then
              echo "::error::RC qualification requires a newly created, non-forced tag ref"
              exit 1
            fi
            # Re-fetch the tag OBJECT, exactly as the dispatch path above does.
            #
            # `actions/checkout` does not leave one behind. With `fetch-depth: 0` it ignores
            # `fetch-tags` entirely, then runs its own ref check: for `refs/tags/*` it compares
            # the resolved commit against `git rev-parse refs/tags/<tag>`, which for an
            # ANNOTATED tag is the tag object's own SHA and therefore never equal. It reacts by
            # fetching `+<commit>:refs/tags/<tag>`, force-overwriting the annotated ref with a
            # lightweight one pointing at the commit.
            #
            # `resolve_annotated_rc_tag` then asks `git cat-file -t refs/tags/<tag>`, sees
            # `commit`, and refuses a correctly annotated tag. Measured on v6.0.0-rc.1: the API
            # reports `type=tag`, tagger 0xLeif, target 89886855; the run it triggered eight
            # seconds later refused it. `fetch-tags: true` does not help — it is silently
            # dropped on this code path — so this restores the object the checkout destroyed.
            git fetch --force origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
          else
            echo "::error::Unsupported release event/ref: ${EVENT_NAME}/${REF_NAME}"
            exit 1
          fi

          candidate_file="${RUNNER_TEMP}/specsync-rc-candidate.json"
          candidate_manifest="${RUNNER_TEMP}/specsync-rc-Cargo.toml"
          git show "refs/tags/${rc_tag}^{commit}:Cargo.toml" > "$candidate_manifest"
          python3 .github/scripts/validate-release-candidate.py candidate \
            --repository . --cargo-toml "$candidate_manifest" \
            --rc-tag "$rc_tag" > "$candidate_file"
          candidate_sha="$(jq -r '.candidate_sha' "$candidate_file")"
          version="$(jq -r '.package_version' "$candidate_file")"
          expected_final_tag="$(jq -r '.final_tag' "$candidate_file")"
          final_tag="$expected_final_tag"

          rulesets_file="${RUNNER_TEMP}/specsync-rulesets.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/rulesets?includes_parents=true" > "$rulesets_file"
          resolve_ruleset() {
            local ruleset_name="$1"
            local output_file="$2"
            local ruleset_ids=()
            mapfile -t ruleset_ids < <(
              jq -r --arg name "$ruleset_name" \
                '.[] | select(.name == $name) | .id' "$rulesets_file"
            )
            if [[ "${#ruleset_ids[@]}" -ne 1 ]]; then
              echo "::error::Repository requires exactly one ${ruleset_name} ruleset"
              exit 1
            fi
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/rulesets/${ruleset_ids[0]}?includes_parents=true" \
              > "$output_file"
          }
          # Two rulesets, not three. The original design also demanded a `SpecSync final tag
          # creation` ruleset whose only bypass actor was a dedicated release GitHub App, plus a
          # protected `release` deployment environment holding that App's key. Neither was ever
          # provisioned, so this step failed on v6.0.0-rc.1 through rc.6 and the check has never
          # once passed. A gate that always fails proves nothing: the two rulesets that DO exist
          # were never reached, let alone verified.
          #
          # The owner's decision is to keep the two immutability rulesets and drop the App-only
          # creation policy. What is dropped is announced, not buried — see the warning loop below.
          final_immutability_ruleset_file="${RUNNER_TEMP}/specsync-final-immutability-ruleset.json"
          rc_ruleset_file="${RUNNER_TEMP}/specsync-rc-tag-ruleset.json"
          resolve_ruleset "SpecSync immutable final tags" "$final_immutability_ruleset_file"
          resolve_ruleset "SpecSync immutable RC tags" "$rc_ruleset_file"
          rulesets_result_file="${RUNNER_TEMP}/specsync-rulesets-result.json"
          python3 .github/scripts/validate-release-candidate.py rulesets \
            --final-immutability-ruleset-json "$final_immutability_ruleset_file" \
            --rc-ruleset-json "$rc_ruleset_file" > "$rulesets_result_file"

          # Say, on every single run including green ones, which tag protections this workflow does
          # NOT verify. Nobody reading a passing release may conclude that App-only final-tag
          # creation is enforced, because it is not. The validator refuses to emit an empty list,
          # so this cannot silently stop reporting.
          unenforced_count="$(jq -r '.unenforced | length' "$rulesets_result_file")"
          if [[ "$unenforced_count" -lt 1 ]]; then
            echo "::error::Ruleset validation must declare the protections it does not enforce"
            exit 1
          fi
          echo "### Release tag protections NOT verified by this run" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r unenforced; do
            echo "::warning title=Release protection not enforced::${unenforced}"
            echo "- :warning: ${unenforced}" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.unenforced[]' "$rulesets_result_file")

          # A deleted/recreated or force-moved tag leaves release-workflow runs
          # with more than one head SHA. Refuse that tag name permanently.
          runs_file="${RUNNER_TEMP}/specsync-rc-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/workflows/release.yml/runs?event=push&branch=${rc_tag}&per_page=100" \
            > "$runs_file"
          if ! jq -e --arg sha "$candidate_sha" \
              '(.total_count <= 100) and all(.workflow_runs[]; .head_sha == $sha)' \
              "$runs_file" >/dev/null; then
            echo "::error::${rc_tag} has excessive or conflicting candidate workflow history"
            exit 1
          fi

          {
            echo "mode=${mode}"
            echo "rc_tag=${rc_tag}"
            echo "final_tag=${final_tag}"
            echo "version=${version}"
            echo "candidate_sha=${candidate_sha}"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      # This job used to also wait for a check run named "SpecSync archive
      # binding" and validate it in ~430 lines of embedded Python. Its producer,
      # post-merge-archive.yml, was deleted in #499 as part of removing the CI
      # reimplementation of the SDD lifecycle, and nothing replaced it — so the
      # wait matched nothing, `validate` failed closed, and every job downstream
      # of it (qualify, authorize-release, promote, build, release) was
      # unreachable. `validate` has no mode guard, so this blocked the RC tag,
      # not only the final tag. See #635.
      #
      # The archive-to-merge-commit binding is now enforced solely by SpecSync
      # itself, in `change ship` and archive validation, which is where #499 put
      # the lifecycle. The release lane no longer re-derives it from Git
      # topology.
      # The only bare `cargo` invocation in any workflow here. Without this, the rustup shim
      # reads the CANDIDATE's `rust-toolchain.toml` and downloads whatever it names, inside a
      # 5-minute timeout and with no cache in this job — an unpinned toolchain fetch driven by
      # candidate-controlled content, on the step whose whole job is to decide whether that
      # candidate can be trusted. Pinning it makes the toolchain a property of the lane rather
      # than of the thing under test.
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0

      - name: Validate candidate source
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.candidate_sha }}
          TAG_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Order matters. `cargo metadata` runs the candidate's own build scripts and
          # manifests, so it must not run until the candidate has been proven to be
          # integrated into `origin/main`. The ancestor check is what makes this checkout
          # trustworthy at all; it used to be the LAST thing here, which meant cargo touched
          # unverified code first. Nothing about a legitimate candidate changes.
          release_commit="$(git rev-parse "${RELEASE_COMMIT}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$release_commit" ]; then
            echo "::error::Checkout is not the resolved release candidate"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release commit is not integrated into origin/main"
            exit 1
          fi
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "specsync") | .version')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match Cargo package version $PACKAGE_VERSION"
            exit 1
          fi


  qualify:
    needs: [resolve, validate]
    if: needs.resolve.outputs.mode == 'qualify'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
            fledge_asset: fledge-linux-x86_64
            fledge_sha256: bebbd9b9f377468b377ee1e177aef96992ee8f8d9f075f9fe2323153f2e165ec
          - platform: macos
            os: macos-14
            fledge_asset: fledge-macos-x86_64
            fledge_sha256: 5c52a05710918d8bf566546fdaa8f32792b169bbefad46addb6009837f7819d2
          - platform: windows
            os: windows-latest
            fledge_asset: fledge-windows-x86_64.exe
            fledge_sha256: 2349f2c24c40929fb7317627cb40915fe5ac33b697e5876020b8b8e6e3b69a47
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Restore, never save. This runner has checked out `candidate_sha`, which on a
          # `workflow_dispatch` is derived from an operator-supplied tag, and the run carries
          # default-branch privileges. Writing a cache entry from that tree is what lets a
          # candidate that is not what the operator believes seed a cache later restored by
          # default-branch workflows. Reading one is harmless.
          #
          # The cost is a cold build on the release lane, which runs rarely and is the one
          # place where a slower build is obviously worth an unpoisonable one.
          save-if: false

      - name: Prepare Windows integration shell
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "C:/Program Files/Git/bin" >> "$GITHUB_PATH"
          bash_path="C:/Progra~1/Git/bin/bash.exe"
          if [[ ! -x "$bash_path" ]]; then
            bash_path="C:/Program Files/Git/bin/bash.exe"
          fi
          echo "SPECSYNC_BASH=${bash_path}" >> "$GITHUB_ENV"
          curl -fsSL -o /usr/bin/jq.exe \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          jq_digest="$(sha256sum /usr/bin/jq.exe | awk '{print $1}')"
          if [[ "$jq_digest" != "7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab" ]]; then
            echo "::error::jq checksum mismatch: ${jq_digest}"
            exit 1
          fi

      - name: Install pinned Fledge (Unix)
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.fledge_asset }}
          EXPECTED_SHA256: ${{ matrix.fledge_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/CorvidLabs/fledge/releases/download/v1.7.2"
          curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${base}/${ASSET}"
          actual_sha256="$(shasum -a 256 "${RUNNER_TEMP}/${ASSET}" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Fledge checksum mismatch: ${actual_sha256}"
            exit 1
          fi
          chmod +x "${RUNNER_TEMP}/${ASSET}"
          mv "${RUNNER_TEMP}/${ASSET}" "${RUNNER_TEMP}/fledge"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install pinned Fledge (Windows)
        if: runner.os == 'Windows'
        env:
          ASSET: ${{ matrix.fledge_asset }}
          EXPECTED_SHA256: ${{ matrix.fledge_sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/CorvidLabs/fledge/releases/download/v1.7.2"
          $binary = Join-Path $env:RUNNER_TEMP $env:ASSET
          Invoke-WebRequest "$base/$env:ASSET" -OutFile $binary
          $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Fledge checksum mismatch: expected $env:EXPECTED_SHA256, got $actual"
          }
          Copy-Item $binary (Join-Path $env:RUNNER_TEMP "fledge.exe")
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run immutable release-candidate lane
        env:
          SPECSYNC_BASH: ${{ runner.os == 'Windows' && 'C:\Progra~1\Git\bin\bash.exe' || '' }}
        run: fledge lanes run release-candidate

      - name: Write SHA-bound platform evidence
        if: always()
        # `shell: python` is a literal PATH lookup for `python` with no `python3` fallback
        # (actions/runner ScriptHandlerHelpers maps it to "{0}"). macOS runner images install
        # only `python3` — the readme lists Python3/Pip3 and no bare `Python` — so this step
        # fails there with "Unable to locate executable file: python".
        #
        # It is `if: always()`, so the failure is silent in the step list and lands as a MISSING
        # ARTIFACT: no `macos.json`, so the evidence upload is `if-no-files-found: error`, so
        # `record-qualification` never gets its three platform files, so the RC gate posts
        # `failure` and can never go green. A missing interpreter three jobs upstream presents
        # as an unqualifiable release candidate.
        #
        # `shell: python3` is not a built-in keyword; the custom form below is what works
        # everywhere, and `python3` exists on all three runner images.
        shell: python3 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          OUTCOME: ${{ job.status }}
        run: |
          import json
          import os
          from pathlib import Path

          output = Path("qualification-evidence")
          output.mkdir(exist_ok=True)
          record = {
              "schema_version": 1,
              "platform": os.environ["PLATFORM"],
              "rc_tag": os.environ["RC_TAG"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "lane": "release-candidate",
              "outcome": os.environ["OUTCOME"],
              "package_version": os.environ["PACKAGE_VERSION"],
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
          }
          (output / f"{record['platform']}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-evidence-${{ matrix.platform }}
          path: qualification-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
          overwrite: true

  record-qualification:
    needs: [resolve, validate, qualify]
    if: always() && needs.resolve.outputs.mode == 'qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          persist-credentials: false

      - name: Download platform evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rc-evidence-*
          path: qualification-evidence
          merge-multiple: true

      - name: Validate exact platform evidence
        if: always()
        id: verify
        continue-on-error: true
        run: |
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py evidence \
            --rc-tag "${{ needs.resolve.outputs.rc_tag }}" \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --evidence-dir qualification-evidence

      - name: Publish immutable candidate gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion="failure"
          summary="One or more required platform qualifications failed or produced invalid evidence."
          if [[ "$VERIFY_OUTCOME" == "success" && \
                "${{ needs.validate.result }}" == "success" && \
                "${{ needs.qualify.result }}" == "success" ]]; then
            conclusion="success"
            summary="Ubuntu, macOS, and Windows passed the release-candidate lane for the exact immutable candidate SHA."
          fi
          gh api --method POST "repos/${REPOSITORY}/check-runs" \
            -f name="SpecSync release candidate" \
            -f head_sha="$CANDIDATE_SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f external_id="specsync-rc:${RC_TAG}:${CANDIDATE_SHA}" \
            -f details_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}" \
            -f "output[title]=${RC_TAG} platform qualification" \
            -f "output[summary]=${summary}"
          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi

  authorize-release:
    needs: [resolve, validate]
    if: needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualification_run_id: ${{ steps.authorize.outputs.qualification_run_id }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      # This checkout IS needed, despite appearances: the verification step below runs
      # `git show-ref`, `git rev-parse HEAD` and `.github/scripts/validate-release-candidate.py`
      # against `--repository .`, all of which require the tree.
      #
      # It is checked out at `candidate_sha`, and the CodeQL cache-poisoning finding on this
      # job is therefore real rather than spurious. What makes it tolerable is that nothing
      # in this job populates the Actions cache — no `rust-cache`, no `cargo`, no
      # `actions/cache`. The exposure the rule describes needs a cache write, and there is
      # none here. If a caching step is ever added to this job, it must carry `save-if: false`
      # like the build jobs do.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Verify exact successful RC gate
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checks_file="${RUNNER_TEMP}/specsync-rc-checks.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
            > "$checks_file"
          check_file="${RUNNER_TEMP}/specsync-rc-check.json"
          jq -e \
            --arg head "$CANDIDATE_SHA" \
            --arg external "specsync-rc:${RC_TAG}:${CANDIDATE_SHA}" \
            '
              [
                .check_runs[]
                | select(.name == "SpecSync release candidate")
                | select(.head_sha == $head)
                | select(.external_id == $external)
                | select(.app.slug == "github-actions")
              ]
              | sort_by(.id)
              | last
            ' "$checks_file" > "$check_file"
          if ! jq -e '.status == "completed" and .conclusion == "success"' \
              "$check_file" >/dev/null; then
            echo "::error::The newest exact RC gate is not successful"
            exit 1
          fi
          # Do NOT derive the run from `details_url`.
          #
          # GitHub discards the `details_url` posted to POST /check-runs from an Actions token
          # and persists its own canonical `/runs/<check-run-id>`. So the prefix test below used
          # to reject every green gate, and had it passed, the id extracted would have been a
          # CHECK-RUN id used as a WORKFLOW-RUN id — a wrong answer rather than an error.
          #
          # This repository already learned this once. CHG-0076, "accept GitHub's rewritten
          # trusted policy check URL while preserving exact base control", records the rule:
          #
          #     A display URL is not a stable provenance field. Acceptance must instead bind
          #     the official check and a successful base-controlled workflow run to the same
          #     repository, candidate SHA, trusted revision, workflow path, and PR.
          #
          # The gate is already bound to the right check by `external_id` above, which GitHub
          # does persist verbatim. The run is now found the same way: by the properties that
          # identify it, not by a link rendered for humans. Every assertion the old path made
          # about the run is unchanged and still applies below.
          runs_file="${RUNNER_TEMP}/specsync-rc-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&event=push&status=success&per_page=100" \
            > "$runs_file"
          run_id="$(jq -r \
            --arg rc "$RC_TAG" \
            '
              [ .workflow_runs[]
                | select((.path | split("@")[0]) == ".github/workflows/release.yml")
                | select(.head_branch == $rc)
              ]
              | sort_by(.run_started_at)
              | last
              | .id // empty
            ' "$runs_file")"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful release-lane run found for ${RC_TAG} at ${CANDIDATE_SHA}"
            exit 1
          fi
          run_file="${RUNNER_TEMP}/specsync-rc-run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_file"
          jq -e \
            --arg head "$CANDIDATE_SHA" \
            --arg rc "$RC_TAG" \
            --arg repository "$REPOSITORY" \
            '
              .head_sha == $head
              and .head_branch == $rc
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and ((.path | split("@")[0]) == ".github/workflows/release.yml")
              and .repository.full_name == $repository
            ' "$run_file" >/dev/null

          gh run download "$run_id" --repo "$REPOSITORY" \
            --pattern 'rc-evidence-*' --dir qualification-evidence
          mapfile -t evidence_files < <(
            find qualification-evidence -type f -name '*.json' -print | sort
          )
          if [[ "${#evidence_files[@]}" -ne 3 ]]; then
            echo "::error::RC workflow did not retain exactly three platform evidence records"
            exit 1
          fi
          evidence_arguments=()
          for evidence_file in "${evidence_files[@]}"; do
            evidence_arguments+=(--evidence "$evidence_file")
          done

          validator_mode="promote"
          validator_extra=()
          if git show-ref --verify --quiet "refs/tags/${FINAL_TAG}"; then
            validator_mode="release"
            validator_extra=(--checkout-sha "$(git rev-parse HEAD)")
          fi
          python3 .github/scripts/validate-release-candidate.py "$validator_mode" \
            --repository . \
            --rc-tag "$RC_TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --final-tag "$FINAL_TAG" \
            --lane release-candidate \
            "${validator_extra[@]}" \
            "${evidence_arguments[@]}"
          echo "qualification_run_id=${run_id}" >> "$GITHUB_OUTPUT"

  # The release App is how this job pushes a final tag; it is NOT a policy that stops anyone else
  # from pushing one. There is no `SpecSync final tag creation` ruleset, so a human with tag-write
  # access can create `vX.Y.Z` without ever running this workflow. `resolve` warns about exactly
  # that on every run.
  #
  # Provisioning status, so nobody mistakes silence for readiness: `vars.SPECSYNC_RELEASE_APP_ID`,
  # `secrets.SPECSYNC_RELEASE_APP_PRIVATE_KEY`, and the `release` environment are all currently
  # UNSET on this repository, and this job has never run. It fails closed if dispatched — the token
  # step cannot mint a token from an empty app id, and the guard below refuses an empty token
  # before any tag is written — but promotion cannot succeed until an App is created and both
  # values are stored. `resolve` no longer blocks RC qualification on that provisioning; it
  # reports it.
  promote:
    needs: [resolve, validate, authorize-release]
    if: needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Mint repository-scoped release app token
        id: release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SPECSYNC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SPECSYNC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Create final tag from qualified candidate
        env:
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_APP_TOKEN: ${{ steps.release-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APP_TOKEN" ]]; then
            echo "::error::The release environment could not mint a release app token"
            exit 1
          fi
          release_remote="https://github.com/${REPOSITORY}.git"
          # The credential-helper child shell expands the masked token; this shell must not.
          # shellcheck disable=SC2016
          credential_helper='credential.helper=!f() { test "$1" = get || exit 0; printf "%s\n" "username=x-access-token" "password=$RELEASE_APP_TOKEN"; }; f'
          git_release() {
            GIT_TERMINAL_PROMPT=0 git -c "$credential_helper" "$@"
          }

          if git_release ls-remote --exit-code --tags "$release_remote" \
              "refs/tags/${FINAL_TAG}" >/dev/null 2>&1; then
            git_release fetch --force "$release_remote" \
              "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
            if [[ "$(git rev-parse "refs/tags/${FINAL_TAG}^{commit}")" != "$CANDIDATE_SHA" ]]; then
              echo "::error::${FINAL_TAG} already points at a different commit"
              exit 1
            fi
            echo "${FINAL_TAG} already identifies the qualified candidate; continuing idempotently."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$FINAL_TAG" "$CANDIDATE_SHA" \
              -m "Release ${FINAL_TAG} from qualified ${RC_TAG}"
            git_release push "$release_remote" "refs/tags/${FINAL_TAG}"
          fi

  build:
    needs: [resolve, validate, authorize-release, promote]
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.authorize-release.result == 'success'
      && needs.resolve.outputs.mode == 'promote'
      && needs.promote.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: specsync-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: specsync-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: specsync-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: specsync-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: specsync-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: specsync-windows-x86_64.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl toolchain (Linux musl)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Restore, never save. This runner has checked out `candidate_sha`, which on a
          # `workflow_dispatch` is derived from an operator-supplied tag, and the run carries
          # default-branch privileges. Writing a cache entry from that tree is what lets a
          # candidate that is not what the operator believes seed a cache later restored by
          # default-branch workflows. Reading one is harmless.
          #
          # The cost is a cold build on the release lane, which runs rarely and is the one
          # place where a slower build is obviously worth an unpoisonable one.
          save-if: false

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cp "target/${TARGET}/release/specsync" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Copy-Item "target/$env:TARGET/release/specsync.exe" $env:ARTIFACT
          Compress-Archive -Path $env:ARTIFACT -DestinationPath "$env:ARTIFACT.zip"
          $hash = (Get-FileHash "$env:ARTIFACT.zip" -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $env:ARTIFACT.zip`n"
          [IO.File]::WriteAllBytes(
            "$env:ARTIFACT.zip.sha256",
            [Text.Encoding]::ASCII.GetBytes($line)
          )

      - name: Verify packaged checksum
        # `shell: python` is a literal PATH lookup for `python` with no `python3` fallback
        # (actions/runner ScriptHandlerHelpers maps it to "{0}"). macOS runner images install
        # only `python3` — the readme lists Python3/Pip3 and no bare `Python` — so this step
        # fails there with "Unable to locate executable file: python".
        #
        # It is `if: always()`, so the failure is silent in the step list and lands as a MISSING
        # ARTIFACT: no `macos.json`, so the evidence upload is `if-no-files-found: error`, so
        # `record-qualification` never gets its three platform files, so the RC gate posts
        # `failure` and can never go green. A missing interpreter three jobs upstream presents
        # as an unqualifiable release candidate.
        #
        # `shell: python3` is not a built-in keyword; the custom form below is what works
        # everywhere, and `python3` exists on all three runner images.
        shell: python3 {0}
        env:
          ARTIFACT: ${{ matrix.artifact }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          suffix = ".zip" if os.environ["RUNNER_OS"] == "Windows" else ".tar.gz"
          archive = Path(f"{os.environ['ARTIFACT']}{suffix}")
          checksum = Path(f"{archive}.sha256")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = f"{digest}  {archive.name}\n".encode("ascii")
          actual = checksum.read_bytes()

          if actual != expected:
              raise SystemExit(
                  f"invalid checksum file {checksum}: expected LF-only SHA-256 record"
              )
          provenance = {
              "archive": archive.name,
              "artifact": os.environ["ARTIFACT"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "rc_tag": os.environ["RC_TAG"],
              "schema_version": 1,
              "sha256": digest,
          }
          Path(f"{os.environ['ARTIFACT']}.provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.provenance.json
          overwrite: true

  release:
    needs: [resolve, authorize-release, promote, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Revalidate downloaded artifact identity and checksums
        run: |
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py artifacts \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --rc-tag "${{ needs.resolve.outputs.rc_tag }}" \
            --artifact-dir artifacts

      - name: Re-resolve tags, checkout, and original platform evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ needs.authorize-release.outputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Promotion has no authenticated qualification run"
            exit 1
          fi
          git fetch --force origin \
            "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}" \
            "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
          gh run download "$QUALIFICATION_RUN_ID" --repo "$REPOSITORY" \
            --pattern 'rc-evidence-*' --dir qualification-evidence-final
          mapfile -t evidence_files < <(
            find qualification-evidence-final -type f -name '*.json' -print | sort
          )
          if [[ "${#evidence_files[@]}" -ne 3 ]]; then
            echo "::error::Release requires exactly three original platform evidence records"
            exit 1
          fi
          evidence_arguments=()
          for evidence_file in "${evidence_files[@]}"; do
            evidence_arguments+=(--evidence "$evidence_file")
          done
          unset GH_TOKEN
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py release \
            --repository . \
            --rc-tag "$RC_TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --final-tag "$FINAL_TAG" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --lane release-candidate \
            "${evidence_arguments[@]}"

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_lookup="${RUNNER_TEMP}/specsync-release-lookup.txt"
          release_error="${RUNNER_TEMP}/specsync-release-lookup-error.txt"
          release_status=""
          for attempt in 1 2 3; do
            set +e
            gh api --include \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/releases/tags/${FINAL_TAG}" \
              > "$release_lookup" 2> "$release_error"
            lookup_exit=$?
            set -e
            release_status="$(
              sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$release_lookup"
            )"
            if [[ "$release_status" == "200" ]]; then
              echo "::error::Release ${FINAL_TAG} already exists; immutable assets cannot be replaced"
              exit 1
            fi
            if [[ "$release_status" == "404" ]]; then
              break
            fi
            echo "Release lookup attempt ${attempt}/3 failed with HTTP ${release_status:-unknown} (exit ${lookup_exit})."
            if [[ "$attempt" != "3" ]]; then
              sleep 5
            fi
          done
          if [[ "$release_status" != "404" ]]; then
            echo "::error::Cannot prove release ${FINAL_TAG} is absent; refusing publication"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.final_tag }}
          target_commitish: ${{ needs.resolve.outputs.candidate_sha }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
