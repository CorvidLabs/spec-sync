name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable annotated RC tag to promote after qualification
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

concurrency:
  group: specsync-release-${{ inputs.rc_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      rc_tag: ${{ steps.resolve.outputs.rc_tag }}
      final_tag: ${{ steps.resolve.outputs.final_tag }}
      version: ${{ steps.resolve.outputs.version }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve immutable release candidate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_RC_TAG: ${{ inputs.rc_tag }}
          PUSH_CREATED: ${{ github.event.created }}
          PUSH_FORCED: ${{ github.event.forced }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_APP_ID: ${{ vars.SPECSYNC_RELEASE_APP_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected_workflow_ref="${REPOSITORY}/.github/workflows/release.yml@refs/heads/${DEFAULT_BRANCH}"
            if [[ "$WORKFLOW_REF" != "$expected_workflow_ref" ]]; then
              echo "::error::Promotion must be dispatched from ${DEFAULT_BRANCH}"
              exit 1
            fi
            mode="promote"
            rc_tag="$REQUESTED_RC_TAG"
            git fetch --force origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
          elif [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            mode="qualify"
            rc_tag="$REF_NAME"
            if [[ "$PUSH_CREATED" != "true" || "$PUSH_FORCED" == "true" ]]; then
              echo "::error::RC qualification requires a newly created, non-forced tag ref"
              exit 1
            fi
          else
            echo "::error::Unsupported release event/ref: ${EVENT_NAME}/${REF_NAME}"
            exit 1
          fi

          candidate_file="${RUNNER_TEMP}/specsync-rc-candidate.json"
          candidate_manifest="${RUNNER_TEMP}/specsync-rc-Cargo.toml"
          git show "refs/tags/${rc_tag}^{commit}:Cargo.toml" > "$candidate_manifest"
          python3 .github/scripts/validate-release-candidate.py candidate \
            --repository . --cargo-toml "$candidate_manifest" \
            --rc-tag "$rc_tag" > "$candidate_file"
          candidate_sha="$(jq -r '.candidate_sha' "$candidate_file")"
          version="$(jq -r '.package_version' "$candidate_file")"
          expected_final_tag="$(jq -r '.final_tag' "$candidate_file")"
          final_tag="$expected_final_tag"

          rulesets_file="${RUNNER_TEMP}/specsync-rulesets.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/rulesets?includes_parents=true" > "$rulesets_file"
          resolve_ruleset() {
            local ruleset_name="$1"
            local output_file="$2"
            local ruleset_ids=()
            mapfile -t ruleset_ids < <(
              jq -r --arg name "$ruleset_name" \
                '.[] | select(.name == $name) | .id' "$rulesets_file"
            )
            if [[ "${#ruleset_ids[@]}" -ne 1 ]]; then
              echo "::error::Repository requires exactly one ${ruleset_name} ruleset"
              exit 1
            fi
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/rulesets/${ruleset_ids[0]}?includes_parents=true" \
              > "$output_file"
          }
          final_creation_ruleset_file="${RUNNER_TEMP}/specsync-final-creation-ruleset.json"
          final_immutability_ruleset_file="${RUNNER_TEMP}/specsync-final-immutability-ruleset.json"
          rc_ruleset_file="${RUNNER_TEMP}/specsync-rc-tag-ruleset.json"
          resolve_ruleset "SpecSync final tag creation" "$final_creation_ruleset_file"
          resolve_ruleset "SpecSync immutable final tags" "$final_immutability_ruleset_file"
          resolve_ruleset "SpecSync immutable RC tags" "$rc_ruleset_file"
          python3 .github/scripts/validate-release-candidate.py rulesets \
            --final-creation-ruleset-json "$final_creation_ruleset_file" \
            --final-immutability-ruleset-json "$final_immutability_ruleset_file" \
            --rc-ruleset-json "$rc_ruleset_file" \
            --release-app-id "$RELEASE_APP_ID"

          environment_file="${RUNNER_TEMP}/specsync-release-environment.json"
          branch_policies_file="${RUNNER_TEMP}/specsync-release-branch-policies.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/environments/release" > "$environment_file"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/environments/release/deployment-branch-policies?per_page=100" \
            > "$branch_policies_file"
          python3 .github/scripts/validate-release-candidate.py environment \
            --environment-json "$environment_file" \
            --branch-policies-json "$branch_policies_file" \
            --default-branch "$DEFAULT_BRANCH"

          # A deleted/recreated or force-moved tag leaves release-workflow runs
          # with more than one head SHA. Refuse that tag name permanently.
          runs_file="${RUNNER_TEMP}/specsync-rc-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/workflows/release.yml/runs?event=push&branch=${rc_tag}&per_page=100" \
            > "$runs_file"
          if ! jq -e --arg sha "$candidate_sha" \
              '(.total_count <= 100) and all(.workflow_runs[]; .head_sha == $sha)' \
              "$runs_file" >/dev/null; then
            echo "::error::${rc_tag} has excessive or conflicting candidate workflow history"
            exit 1
          fi

          {
            echo "mode=${mode}"
            echo "rc_tag=${rc_tag}"
            echo "final_tag=${final_tag}"
            echo "version=${version}"
            echo "candidate_sha=${candidate_sha}"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Validate candidate source and merged archive binding
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.candidate_sha }}
          TAG_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "specsync") | .version')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match Cargo package version $PACKAGE_VERSION"
            exit 1
          fi
          release_commit="$(git rev-parse "${RELEASE_COMMIT}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$release_commit" ]; then
            echo "::error::Checkout is not the resolved release candidate"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release commit is not integrated into origin/main"
            exit 1
          fi

          checks_file="${RUNNER_TEMP}/specsync-release-checks.json"
          binding_status=""
          for attempt in $(seq 1 12); do
            if gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${REPOSITORY}/commits/${release_commit}/check-runs?per_page=100" \
                > "$checks_file"; then
              binding_status="$(
                jq -r \
                  --arg head "$release_commit" \
                  --arg details_prefix "${SERVER_URL}/${REPOSITORY}/actions/runs/" \
                  '
                  [
                    .check_runs[]
                    | select(.name == "SpecSync archive binding")
                    | select(.head_sha == $head)
                    | select(.app.slug == "github-actions")
                    | select(.app.id | type == "number")
                    | select(
                        .external_id
                        | test("^specsync-archive:CHG-[0-9]{4,}-.+:[0-9a-f]{64}$")
                      )
                    | select(.details_url | startswith($details_prefix))
                  ]
                  | sort_by(.id)
                  | last
                  | if . == null then "missing"
                    else "\(.status)/\(.conclusion // "")"
                    end
                ' "$checks_file"
              )"
              if [ "$binding_status" = "completed/success" ]; then
                break
              fi
              if [[ "$binding_status" == completed/* ]]; then
                echo "::error::SpecSync archive binding ended with ${binding_status}"
                exit 1
              fi
            fi
            echo "Waiting for SpecSync archive binding (${attempt}/12): ${binding_status:-lookup failed}"
            sleep 10
          done
          if [ "$binding_status" != "completed/success" ]; then
            echo "::error::Release commit has no structurally valid SpecSync archive binding check"
            exit 1
          fi

          export CHECKS_FILE="$checks_file"
          export RELEASE_COMMIT="$release_commit"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import subprocess
          import sys
          import time

          release_commit = os.environ["RELEASE_COMMIT"]
          repository = os.environ["REPOSITORY"]
          server_url = os.environ["SERVER_URL"].rstrip("/")
          with open(os.environ["CHECKS_FILE"], encoding="utf-8") as handle:
              checks = json.load(handle).get("check_runs", [])
          with open(
              ".github/scripts/lifecycle-validation-limits.json",
              encoding="utf-8",
          ) as handle:
              limits = json.load(handle)
          max_git_output_bytes = int(limits["git_max_output_bytes"])
          git_timeout_seconds = int(limits["git_timeout_seconds"])
          if min(max_git_output_bytes, git_timeout_seconds) <= 0:
              raise SystemExit("lifecycle validation limits must be positive")

          def api(endpoint: str) -> dict:
              output = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2022-11-28",
                      endpoint,
                  ],
                  text=True,
              )
              return json.loads(output)

          github_actions_app = api("apps/github-actions")
          if (
              github_actions_app.get("slug") != "github-actions"
              or github_actions_app.get("name") != "GitHub Actions"
              or (github_actions_app.get("owner") or {}).get("login") != "github"
          ):
              raise SystemExit("could not resolve the official GitHub Actions app")

          def git_bytes(*args: str) -> bytes:
              process = subprocess.Popen(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if process.stdout is None or process.stderr is None:
                  process.kill()
                  raise SystemExit("failed to capture bounded git query")
              selector = selectors.DefaultSelector()
              selector.register(process.stdout, selectors.EVENT_READ, "stdout")
              selector.register(process.stderr, selectors.EVENT_READ, "stderr")
              stdout = bytearray()
              stderr = bytearray()
              total_output = 0
              deadline = time.monotonic() + git_timeout_seconds
              try:
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          process.kill()
                          process.wait()
                          raise SystemExit(
                              f"bounded git query timed out: {' '.join(args)}"
                          )
                      events = selector.select(timeout=remaining)
                      if not events:
                          continue
                      for key, _ in events:
                          chunk = os.read(key.fileobj.fileno(), 64 * 1024)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          total_output += len(chunk)
                          if total_output > max_git_output_bytes:
                              process.kill()
                              process.wait()
                              raise SystemExit(
                                  "bounded git query exceeded "
                                  f"{max_git_output_bytes} bytes: {' '.join(args)}"
                              )
                          if key.data == "stdout":
                              stdout.extend(chunk)
                          elif len(stderr) < 4096:
                              stderr.extend(chunk[: 4096 - len(stderr)])
                  returncode = process.wait(timeout=5)
              finally:
                  selector.close()
                  if process.poll() is None:
                      process.kill()
                      process.wait()
              if returncode != 0:
                  detail = bytes(stderr).decode(errors="replace").strip()
                  raise subprocess.CalledProcessError(
                      returncode,
                      ["git", *args],
                      output=bytes(stdout),
                      stderr=detail,
                  )
              return bytes(stdout)

          def git(*args: str) -> str:
              return git_bytes(*args).decode().strip()

          def git_status(*args: str) -> int:
              try:
                  return subprocess.run(
                      ["git", *args],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False,
                      timeout=git_timeout_seconds,
                  ).returncode
              except subprocess.TimeoutExpired as error:
                  raise SystemExit(
                      f"bounded git status query timed out: {' '.join(args)}"
                  ) from error

          errors = []
          candidates = sorted(
              (
                  check
                  for check in checks
                  if check.get("name") == "SpecSync archive binding"
              ),
              key=lambda check: int(check.get("id", 0)),
              reverse=True,
          )
          for check in candidates:
              try:
                  if check.get("head_sha") != release_commit:
                      raise ValueError("wrong check head SHA")
                  if (
                      check.get("status") != "completed"
                      or check.get("conclusion") != "success"
                  ):
                      raise ValueError("check is not successful")
                  app = check.get("app") or {}
                  if (
                      app.get("id") != github_actions_app.get("id")
                      or app.get("slug") != github_actions_app.get("slug")
                  ):
                      raise ValueError("check is not from GitHub Actions")
                  external = re.fullmatch(
                      r"specsync-archive:(CHG-[0-9]{4,}-.+):([0-9a-f]{64})",
                      str(check.get("external_id") or ""),
                  )
                  if external is None:
                      raise ValueError("invalid archive-binding external_id")
                  change_id, recorded_digest = external.groups()
                  details = re.fullmatch(
                      (
                          rf"{re.escape(server_url)}/{re.escape(repository)}"
                          r"/actions/runs/([0-9]+)"
                      ),
                      str(check.get("details_url") or ""),
                  )
                  if details is None:
                      raise ValueError("invalid archive-binding details URL")
                  run_id = int(details.group(1))
                  workflow_run = api(
                      f"repos/{repository}/actions/runs/{run_id}"
                  )
                  if workflow_run.get("id") != run_id:
                      raise ValueError("wrong workflow run ID")
                  if workflow_run.get("html_url") != check.get("details_url"):
                      raise ValueError("details URL does not identify the resolved run")
                  if workflow_run.get("head_sha") != release_commit:
                      raise ValueError("workflow run has the wrong head SHA")
                  if workflow_run.get("event") != "pull_request":
                      raise ValueError(
                          "workflow run is not for the merged pull request"
                      )
                  if (
                      workflow_run.get("status") != "completed"
                      or workflow_run.get("conclusion") != "success"
                  ):
                      raise ValueError("workflow run is not successful")
                  if (
                      str(workflow_run.get("path") or "").split("@", 1)[0]
                      != ".github/workflows/post-merge-archive.yml"
                  ):
                      raise ValueError("workflow run has the wrong path")
                  if (workflow_run.get("repository") or {}).get(
                      "full_name"
                  ) != repository:
                      raise ValueError("workflow run belongs to another repository")

                  summary_match = re.match(
                      (
                          rf"^SpecSync finalized \*\*{re.escape(change_id)}\*\* "
                          r"in PR #([0-9]+)\.\n"
                      ),
                      str((check.get("output") or {}).get("summary") or ""),
                  )
                  if summary_match is None:
                      raise ValueError(
                          "archive-binding summary has no exact pull request binding"
                      )
                  pull_request_number = int(summary_match.group(1))
                  associated_pull_requests = {
                      item.get("number")
                      for item in workflow_run.get("pull_requests") or []
                      if isinstance(item.get("number"), int)
                  }
                  if (
                      associated_pull_requests
                      and pull_request_number not in associated_pull_requests
                  ):
                      raise ValueError(
                          "archive-binding summary and workflow-run PR disagree"
                      )
                  pull_request = api(
                      f"repos/{repository}/pulls/{pull_request_number}"
                  )
                  if pull_request.get("merged") is not True:
                      raise ValueError("bound pull request was not merged")
                  if pull_request.get("merge_commit_sha") != release_commit:
                      raise ValueError("bound pull request has a different merge commit")

                  archive_pattern = re.compile(
                      rf"^\.specsync/archive/changes/"
                      rf"[0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}-"
                      rf"{re.escape(change_id)}$"
                  )
                  archive_paths = [
                      item
                      for item in git(
                          "ls-tree",
                          "-d",
                          "-r",
                          "--name-only",
                          release_commit,
                          "--",
                          ".specsync/archive/changes",
                      ).splitlines()
                      if archive_pattern.fullmatch(item)
                  ]
                  if len(archive_paths) != 1:
                      raise ValueError(
                          "external_id does not resolve one exact archived change"
                      )
                  archive_path = archive_paths[0]
                  state = json.loads(
                      git("show", f"{release_commit}:{archive_path}/state.json")
                  )
                  if (
                      state.get("id") != change_id
                      or state.get("state") != "archived"
                  ):
                      raise ValueError("archive state does not match external_id")
                  if state.get("workflow_version") != 2:
                      raise ValueError("archive binding is not workflow_version=2")
                  finalization = json.loads(
                      git(
                          "show",
                          f"{release_commit}:{archive_path}/finalization.json",
                      )
                  )
                  if (
                      finalization.get("schema_version") != 2
                      or finalization.get("change_id") != change_id
                  ):
                      raise ValueError("archive has invalid finalization evidence")
                  implementation_head = (pull_request.get("head") or {}).get("sha")
                  if re.fullmatch(
                      r"[0-9a-f]{40}",
                      str(implementation_head or ""),
                  ) is None:
                      raise ValueError("pull request has no exact implementation head")
                  if git_status(
                      "cat-file",
                      "-e",
                      f"{implementation_head}^{{commit}}",
                  ) != 0:
                      git(
                          "fetch",
                          "--no-tags",
                          "origin",
                          f"refs/pull/{pull_request_number}/head",
                      )
                      if git("rev-parse", "FETCH_HEAD") != implementation_head:
                          raise ValueError("fetched pull-request head has the wrong SHA")
                  introduction_result = json.loads(
                      subprocess.check_output(
                          [
                              sys.executable,
                              str(
                                  Path(
                                      ".github/scripts/"
                                      "verify-archive-introduction.py"
                                  )
                              ),
                              "--git-root",
                              os.getcwd(),
                              "--head",
                              implementation_head,
                              "--archive-path",
                              archive_path,
                          ],
                          text=True,
                          timeout=git_timeout_seconds,
                      )
                  )
                  archive_introduction_commit = introduction_result[
                      "archive_introduction_commit"
                  ]
                  changed_components = sorted(
                      set(state.get("affected_specs") or [])
                  )
                  event = {
                      "schema_version": 1,
                      "change_id": change_id,
                      "pull_request": pull_request_number,
                      "pull_request_url": pull_request.get("html_url"),
                      "implementation_head": implementation_head,
                      "merge_commit": release_commit,
                      "merge_tree": git(
                          "rev-parse",
                          f"{release_commit}^{{tree}}",
                      ),
                      "archive_introduction_commit": archive_introduction_commit,
                      "archive_path": archive_path,
                      "archive_tree": git(
                          "rev-parse",
                          f"{release_commit}:{archive_path}",
                      ),
                      "finalization_digest": finalization.get(
                          "finalization_digest"
                      ),
                      "changed_components": changed_components,
                      "checks": [
                          "Required CI gate",
                          "trust",
                          "SpecSync scoped review",
                          "Validate archive-only finalization",
                      ],
                      "outcome": "merged",
                  }
                  event_bytes = (
                      json.dumps(
                          event,
                          ensure_ascii=False,
                          indent=2,
                          sort_keys=True,
                      )
                      + "\n"
                  ).encode()
                  actual_digest = hashlib.sha256(event_bytes).hexdigest()
                  if actual_digest != recorded_digest:
                      raise ValueError(
                          "external_id digest does not reproduce merged archive binding"
                      )
                  print(
                      f"Validated archive binding check {check.get('id')} from "
                      f"post-merge run {run_id} for {change_id}."
                  )
                  break
              except (
                  json.JSONDecodeError,
                  subprocess.CalledProcessError,
                  TypeError,
                  ValueError,
              ) as error:
                  errors.append(f"check {check.get('id')}: {error}")
          else:
              detail = "; ".join(errors) if errors else "no matching checks"
              raise SystemExit(
                  "release commit has no proven archive-binding check: " + detail
              )
          PY

  qualify:
    needs: [resolve, validate]
    if: needs.resolve.outputs.mode == 'qualify'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
            fledge_asset: fledge-linux-x86_64
            fledge_sha256: bebbd9b9f377468b377ee1e177aef96992ee8f8d9f075f9fe2323153f2e165ec
          - platform: macos
            os: macos-14
            fledge_asset: fledge-macos-x86_64
            fledge_sha256: 5c52a05710918d8bf566546fdaa8f32792b169bbefad46addb6009837f7819d2
          - platform: windows
            os: windows-latest
            fledge_asset: fledge-windows-x86_64.exe
            fledge_sha256: 2349f2c24c40929fb7317627cb40915fe5ac33b697e5876020b8b8e6e3b69a47
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Prepare Windows integration shell
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "C:/Program Files/Git/bin" >> "$GITHUB_PATH"
          bash_path="C:/Progra~1/Git/bin/bash.exe"
          if [[ ! -x "$bash_path" ]]; then
            bash_path="C:/Program Files/Git/bin/bash.exe"
          fi
          echo "SPECSYNC_BASH=${bash_path}" >> "$GITHUB_ENV"
          curl -fsSL -o /usr/bin/jq.exe \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          jq_digest="$(sha256sum /usr/bin/jq.exe | awk '{print $1}')"
          if [[ "$jq_digest" != "7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab" ]]; then
            echo "::error::jq checksum mismatch: ${jq_digest}"
            exit 1
          fi

      - name: Install pinned Fledge (Unix)
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.fledge_asset }}
          EXPECTED_SHA256: ${{ matrix.fledge_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/CorvidLabs/fledge/releases/download/v1.7.2"
          curl -fsSL -o "${RUNNER_TEMP}/${ASSET}" "${base}/${ASSET}"
          actual_sha256="$(shasum -a 256 "${RUNNER_TEMP}/${ASSET}" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Fledge checksum mismatch: ${actual_sha256}"
            exit 1
          fi
          chmod +x "${RUNNER_TEMP}/${ASSET}"
          mv "${RUNNER_TEMP}/${ASSET}" "${RUNNER_TEMP}/fledge"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install pinned Fledge (Windows)
        if: runner.os == 'Windows'
        env:
          ASSET: ${{ matrix.fledge_asset }}
          EXPECTED_SHA256: ${{ matrix.fledge_sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/CorvidLabs/fledge/releases/download/v1.7.2"
          $binary = Join-Path $env:RUNNER_TEMP $env:ASSET
          Invoke-WebRequest "$base/$env:ASSET" -OutFile $binary
          $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Fledge checksum mismatch: expected $env:EXPECTED_SHA256, got $actual"
          }
          Copy-Item $binary (Join-Path $env:RUNNER_TEMP "fledge.exe")
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run immutable release-candidate lane
        env:
          SPECSYNC_BASH: ${{ runner.os == 'Windows' && 'C:\Progra~1\Git\bin\bash.exe' || '' }}
        run: fledge lanes run release-candidate

      - name: Write SHA-bound platform evidence
        if: always()
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          OUTCOME: ${{ job.status }}
        run: |
          import json
          import os
          from pathlib import Path

          output = Path("qualification-evidence")
          output.mkdir(exist_ok=True)
          record = {
              "schema_version": 1,
              "platform": os.environ["PLATFORM"],
              "rc_tag": os.environ["RC_TAG"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "lane": "release-candidate",
              "outcome": os.environ["OUTCOME"],
              "package_version": os.environ["PACKAGE_VERSION"],
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
          }
          (output / f"{record['platform']}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-evidence-${{ matrix.platform }}
          path: qualification-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
          overwrite: true

  record-qualification:
    needs: [resolve, validate, qualify]
    if: always() && needs.resolve.outputs.mode == 'qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          persist-credentials: false

      - name: Download platform evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rc-evidence-*
          path: qualification-evidence
          merge-multiple: true

      - name: Validate exact platform evidence
        if: always()
        id: verify
        continue-on-error: true
        run: |
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py evidence \
            --rc-tag "${{ needs.resolve.outputs.rc_tag }}" \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --evidence-dir qualification-evidence

      - name: Publish immutable candidate gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion="failure"
          summary="One or more required platform qualifications failed or produced invalid evidence."
          if [[ "$VERIFY_OUTCOME" == "success" && \
                "${{ needs.validate.result }}" == "success" && \
                "${{ needs.qualify.result }}" == "success" ]]; then
            conclusion="success"
            summary="Ubuntu, macOS, and Windows passed the release-candidate lane for the exact immutable candidate SHA."
          fi
          gh api --method POST "repos/${REPOSITORY}/check-runs" \
            -f name="SpecSync release candidate" \
            -f head_sha="$CANDIDATE_SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f external_id="specsync-rc:${RC_TAG}:${CANDIDATE_SHA}" \
            -f details_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}" \
            -f "output[title]=${RC_TAG} platform qualification" \
            -f "output[summary]=${summary}"
          if [[ "$conclusion" != "success" ]]; then
            exit 1
          fi

  authorize-release:
    needs: [resolve, validate]
    if: needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualification_run_id: ${{ steps.authorize.outputs.qualification_run_id }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Verify exact successful RC gate
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          checks_file="${RUNNER_TEMP}/specsync-rc-checks.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" \
            > "$checks_file"
          check_file="${RUNNER_TEMP}/specsync-rc-check.json"
          jq -e \
            --arg head "$CANDIDATE_SHA" \
            --arg external "specsync-rc:${RC_TAG}:${CANDIDATE_SHA}" \
            '
              [
                .check_runs[]
                | select(.name == "SpecSync release candidate")
                | select(.head_sha == $head)
                | select(.external_id == $external)
                | select(.app.slug == "github-actions")
              ]
              | sort_by(.id)
              | last
            ' "$checks_file" > "$check_file"
          if ! jq -e '.status == "completed" and .conclusion == "success"' \
              "$check_file" >/dev/null; then
            echo "::error::The newest exact RC gate is not successful"
            exit 1
          fi
          details_url="$(jq -r '.details_url' "$check_file")"
          details_prefix="${SERVER_URL}/${REPOSITORY}/actions/runs/"
          if [[ "$details_url" != "$details_prefix"* ]]; then
            echo "::error::RC gate does not identify a repository Actions run"
            exit 1
          fi
          run_id="${details_url#"$details_prefix"}"
          run_file="${RUNNER_TEMP}/specsync-rc-run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_file"
          jq -e \
            --arg head "$CANDIDATE_SHA" \
            --arg rc "$RC_TAG" \
            --arg repository "$REPOSITORY" \
            '
              .head_sha == $head
              and .head_branch == $rc
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and ((.path | split("@")[0]) == ".github/workflows/release.yml")
              and .repository.full_name == $repository
            ' "$run_file" >/dev/null

          gh run download "$run_id" --repo "$REPOSITORY" \
            --pattern 'rc-evidence-*' --dir qualification-evidence
          mapfile -t evidence_files < <(
            find qualification-evidence -type f -name '*.json' -print | sort
          )
          if [[ "${#evidence_files[@]}" -ne 3 ]]; then
            echo "::error::RC workflow did not retain exactly three platform evidence records"
            exit 1
          fi
          evidence_arguments=()
          for evidence_file in "${evidence_files[@]}"; do
            evidence_arguments+=(--evidence "$evidence_file")
          done

          validator_mode="promote"
          validator_extra=()
          if git show-ref --verify --quiet "refs/tags/${FINAL_TAG}"; then
            validator_mode="release"
            validator_extra=(--checkout-sha "$(git rev-parse HEAD)")
          fi
          python3 .github/scripts/validate-release-candidate.py "$validator_mode" \
            --repository . \
            --rc-tag "$RC_TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --final-tag "$FINAL_TAG" \
            --lane release-candidate \
            "${validator_extra[@]}" \
            "${evidence_arguments[@]}"
          echo "qualification_run_id=${run_id}" >> "$GITHUB_OUTPUT"

  promote:
    needs: [resolve, validate, authorize-release]
    if: needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Mint repository-scoped release app token
        id: release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SPECSYNC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SPECSYNC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Create final tag from qualified candidate
        env:
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RELEASE_APP_TOKEN: ${{ steps.release-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APP_TOKEN" ]]; then
            echo "::error::The release environment could not mint a release app token"
            exit 1
          fi
          release_remote="https://github.com/${REPOSITORY}.git"
          # The credential-helper child shell expands the masked token; this shell must not.
          # shellcheck disable=SC2016
          credential_helper='credential.helper=!f() { test "$1" = get || exit 0; printf "%s\n" "username=x-access-token" "password=$RELEASE_APP_TOKEN"; }; f'
          git_release() {
            GIT_TERMINAL_PROMPT=0 git -c "$credential_helper" "$@"
          }

          if git_release ls-remote --exit-code --tags "$release_remote" \
              "refs/tags/${FINAL_TAG}" >/dev/null 2>&1; then
            git_release fetch --force "$release_remote" \
              "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
            if [[ "$(git rev-parse "refs/tags/${FINAL_TAG}^{commit}")" != "$CANDIDATE_SHA" ]]; then
              echo "::error::${FINAL_TAG} already points at a different commit"
              exit 1
            fi
            echo "${FINAL_TAG} already identifies the qualified candidate; continuing idempotently."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$FINAL_TAG" "$CANDIDATE_SHA" \
              -m "Release ${FINAL_TAG} from qualified ${RC_TAG}"
            git_release push "$release_remote" "refs/tags/${FINAL_TAG}"
          fi

  build:
    needs: [resolve, validate, authorize-release, promote]
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.authorize-release.result == 'success'
      && needs.resolve.outputs.mode == 'promote'
      && needs.promote.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: specsync-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: specsync-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: specsync-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: specsync-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: specsync-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: specsync-windows-x86_64.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl toolchain (Linux musl)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cp "target/${TARGET}/release/specsync" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Copy-Item "target/$env:TARGET/release/specsync.exe" $env:ARTIFACT
          Compress-Archive -Path $env:ARTIFACT -DestinationPath "$env:ARTIFACT.zip"
          $hash = (Get-FileHash "$env:ARTIFACT.zip" -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $env:ARTIFACT.zip`n"
          [IO.File]::WriteAllBytes(
            "$env:ARTIFACT.zip.sha256",
            [Text.Encoding]::ASCII.GetBytes($line)
          )

      - name: Verify packaged checksum
        shell: python
        env:
          ARTIFACT: ${{ matrix.artifact }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          suffix = ".zip" if os.environ["RUNNER_OS"] == "Windows" else ".tar.gz"
          archive = Path(f"{os.environ['ARTIFACT']}{suffix}")
          checksum = Path(f"{archive}.sha256")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = f"{digest}  {archive.name}\n".encode("ascii")
          actual = checksum.read_bytes()

          if actual != expected:
              raise SystemExit(
                  f"invalid checksum file {checksum}: expected LF-only SHA-256 record"
              )
          provenance = {
              "archive": archive.name,
              "artifact": os.environ["ARTIFACT"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "rc_tag": os.environ["RC_TAG"],
              "schema_version": 1,
              "sha256": digest,
          }
          Path(f"{os.environ['ARTIFACT']}.provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.provenance.json
          overwrite: true

  release:
    needs: [resolve, authorize-release, promote, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Revalidate downloaded artifact identity and checksums
        run: |
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py artifacts \
            --candidate-sha "${{ needs.resolve.outputs.candidate_sha }}" \
            --rc-tag "${{ needs.resolve.outputs.rc_tag }}" \
            --artifact-dir artifacts

      - name: Re-resolve tags, checkout, and original platform evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RC_TAG: ${{ needs.resolve.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ needs.authorize-release.outputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Promotion has no authenticated qualification run"
            exit 1
          fi
          git fetch --force origin \
            "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}" \
            "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
          gh run download "$QUALIFICATION_RUN_ID" --repo "$REPOSITORY" \
            --pattern 'rc-evidence-*' --dir qualification-evidence-final
          mapfile -t evidence_files < <(
            find qualification-evidence-final -type f -name '*.json' -print | sort
          )
          if [[ "${#evidence_files[@]}" -ne 3 ]]; then
            echo "::error::Release requires exactly three original platform evidence records"
            exit 1
          fi
          evidence_arguments=()
          for evidence_file in "${evidence_files[@]}"; do
            evidence_arguments+=(--evidence "$evidence_file")
          done
          unset GH_TOKEN
          PYTHONNOUSERSITE=1 python3 -I .github/scripts/validate-release-candidate.py release \
            --repository . \
            --rc-tag "$RC_TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --final-tag "$FINAL_TAG" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --lane release-candidate \
            "${evidence_arguments[@]}"

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FINAL_TAG: ${{ needs.resolve.outputs.final_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_lookup="${RUNNER_TEMP}/specsync-release-lookup.txt"
          release_error="${RUNNER_TEMP}/specsync-release-lookup-error.txt"
          release_status=""
          for attempt in 1 2 3; do
            set +e
            gh api --include \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/releases/tags/${FINAL_TAG}" \
              > "$release_lookup" 2> "$release_error"
            lookup_exit=$?
            set -e
            release_status="$(
              sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$release_lookup"
            )"
            if [[ "$release_status" == "200" ]]; then
              echo "::error::Release ${FINAL_TAG} already exists; immutable assets cannot be replaced"
              exit 1
            fi
            if [[ "$release_status" == "404" ]]; then
              break
            fi
            echo "Release lookup attempt ${attempt}/3 failed with HTTP ${release_status:-unknown} (exit ${lookup_exit})."
            if [[ "$attempt" != "3" ]]; then
              sleep 5
            fi
          done
          if [[ "$release_status" != "404" ]]; then
            echo "::error::Cannot prove release ${FINAL_TAG} is absent; refusing publication"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.final_tag }}
          target_commitish: ${{ needs.resolve.outputs.candidate_sha }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
