name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "specsync") | .version')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match Cargo package version $PACKAGE_VERSION"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not integrated into origin/main"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: specsync-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: specsync-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: specsync-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: specsync-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: specsync-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cp "target/${TARGET}/release/specsync" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Copy-Item "target/$env:TARGET/release/specsync.exe" $env:ARTIFACT
          Compress-Archive -Path $env:ARTIFACT -DestinationPath "$env:ARTIFACT.zip"
          $hash = (Get-FileHash "$env:ARTIFACT.zip" -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $env:ARTIFACT.zip`n"
          [IO.File]::WriteAllBytes(
            "$env:ARTIFACT.zip.sha256",
            [Text.Encoding]::ASCII.GetBytes($line)
          )

      - name: Verify packaged checksum
        shell: python
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          import hashlib
          import os
          from pathlib import Path

          suffix = ".zip" if os.environ["RUNNER_OS"] == "Windows" else ".tar.gz"
          archive = Path(f"{os.environ['ARTIFACT']}{suffix}")
          checksum = Path(f"{archive}.sha256")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = f"{digest}  {archive.name}\n".encode("ascii")
          actual = checksum.read_bytes()

          if actual != expected:
              raise SystemExit(
                  f"invalid checksum file {checksum}: expected LF-only SHA-256 record"
              )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
