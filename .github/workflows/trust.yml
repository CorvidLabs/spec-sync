name: trust

# Confidence split (see docs/ci-confidence.md):
# - CI owns multi-OS cargo test, clippy, coverage, audit, site, vscode, action-consumer, path-aware tips
# - Trust owns PR release-binary identity, contract on that binary, Augur, Attest
# - Trust lifecycle lane is trust-lifecycle (types only) — NOT lanes.verify (no second test suite)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  trust:
    name: trust

# Confidence split (see docs/ci-confidence.md):
# - CI owns multi-OS cargo test, clippy, coverage, audit, site, vscode, action-consumer, path-aware tips
# - Trust owns PR release-binary identity, contract on that binary, Augur, Attest
# - Trust lifecycle lane is trust-lifecycle (types only) — NOT lanes.verify (no second test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify an exact metadata-only child
        id: child
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "reuse=false"
            echo "kind=implementation"
            echo "parent_sha="
          } >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          parent_line="$(git rev-list --parents -n 1 "$HEAD_SHA")"
          if [[ "$(wc -w <<<"$parent_line" | tr -d ' ')" != "2" ]]; then
            exit 0
          fi
          parent_sha="$(git rev-parse "${HEAD_SHA}^")"
          classification="$(
            git diff --name-status -z -M "$parent_sha" "$HEAD_SHA" \
              | .github/scripts/classify-ci-paths.sh \
                  "$GITHUB_WORKSPACE" false name-status
          )"
          if grep -Fxq "review_only=true" <<<"$classification"; then
            kind=review
          elif grep -Fxq "archive_only=true" <<<"$classification"; then
            kind=archive
          else
            exit 0
          fi
          {
            echo "reuse=true"
            echo "kind=$kind"
            echo "parent_sha=$parent_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Reuse trust provenance from first-parent ancestors
        if: steps.child.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          START_SHA: ${{ steps.child.outputs.parent_sha }}
          CHECK_NAME: trust
          WORKFLOW_PATH: .github/workflows/trust.yml
          REQUIRE_RUN_SUCCESS: "true"
          MAX_ANCESTORS: "32"
          GIT_ROOT: ${{ github.workspace }}
          CHILD_KIND: ${{ steps.child.outputs.kind }}
        shell: bash
        run: python3 .github/scripts/reuse-check-from-ancestors.py

      - uses: dtolnay/rust-toolchain@1.89.0
        if: steps.child.outputs.reuse != 'true'
        with:
          components: rustfmt, clippy

      - name: Package SpecSync release candidate for Trust (identity artifact; not a test suite)
        if: steps.child.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          mirror="${RUNNER_TEMP}/specsync-trust-mirror"
          binary="specsync-linux-x86_64"
          mkdir -p "$mirror"
          cp target/release/specsync "$mirror/$binary"
          tar -czf "$mirror/$binary.tar.gz" -C "$mirror" "$binary"
          (
            cd "$mirror"
            sha256sum "$binary.tar.gz" > "$binary.tar.gz.sha256"
          )
      # Trust revalidates this checksum-protected runner-local mirror before
      # exercising the pull-request binary as the immutable contract gate.
      - name: CorvidLabs Trust gate
        if: steps.child.outputs.reuse != 'true'
        id: trust
        uses: CorvidLabs/trust@a239f78658e5ad0f12fa230f494890e40c6e4d7b # v1.1.1
        with:
          specsync-version: "6.0.0"
          specsync-download-base-url: file://${{ runner.temp }}/specsync-trust-mirror
