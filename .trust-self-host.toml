# SpecSync alone uses this alternate Trust policy because Trust v1's immutable
# contract action runs released SpecSync 5.0.1, which cannot validate pull
# requests that evolve SpecSync's own lifecycle schema. The blocking lifecycle
# lane still runs the source-built strict 100% contract check. Consumers must
# use the default `.trust.toml`, where the contract component remains enabled.
schema_version = 1
profile = "standard"

[lifecycle]
command = ["fledge", "lanes", "run", "verify"]

[contract]
enabled = false
require_coverage = 100
skip_reason = "SpecSync self-hosts strict 100% contract validation with the source-built binary in the blocking lifecycle lane"

[risk]
threshold = "block"

[provenance]
mode = "soft"
policy = ".attest.json"
skip_reason = ""

[atlas]
enabled = false
skip_reason = "Atlas publication was not enabled during adoption"
