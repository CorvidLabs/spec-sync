schema_version = 1
profile = "standard"

# Lifecycle on GitHub must NOT re-run cargo test (CI matrix owns that).
# Local full suite: `fledge lanes run verify`. See docs/ci-confidence.md.
[lifecycle]
command = ["fledge", "lanes", "run", "trust-lifecycle"]

[contract]
enabled = true
require_coverage = 100
skip_reason = ""

[risk]
threshold = "block"

[provenance]
mode = "soft"
policy = ".attest.json"
skip_reason = ""

[atlas]
enabled = false
skip_reason = "Atlas publication was not enabled during adoption"
