name: 'spec-sync'
description: 'Validate module specs against source code with SpecSync (check, optional lifecycle enforcement, PR comments)'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  version:
    description: 'SpecSync release to download (e.g. "6.2.0"). Pin an exact published release with assets; "latest" resolves the newest GitHub release and is not recommended for CI. Linux and macOS runners only. This main wrapper defaults to published 6.2.0 after supported-platform asset and Action checks. The immutable @v6.2.0 tag retains default 6.1.2; pass version: "6.2.0" with that tag for its new binary. Floating @v6 advances only after checks of this wrapper commit. The immutable @v6.0.0 Action tag still embeds default 6.0.0-rc.14, so always pass version: "6.0.0" when using that tag.'
    required: false
    default: '6.2.0'
  download-base-url:
    description: 'Optional trusted release mirror URL (primarily for enterprise mirrors and release validation)'
    required: false
    default: ''
  strict:
    description: 'Treat warnings as errors'
    required: false
    default: 'false'
  require-coverage:
    description: 'Minimum file coverage percentage (0-100)'
    required: false
    default: '0'
  root:
    description: 'Project root directory'
    required: false
    default: '.'
  args:
    description: 'Additional whitespace-separated arguments to pass to specsync check (shell quoting is not supported)'
    required: false
    default: ''
  lifecycle-enforce:
    description: 'Run lifecycle enforcement checks (--all). Fails CI if specs violate lifecycle rules.'
    required: false
    default: 'false'
  require-archived:
    description: 'Run the archive gate first: fail before downloading or running anything else when any SDD change under .specsync/changes/ is still open (not yet archived). Repositories without .specsync/changes/ pass. Needs python3 and a checkout of the commit under test.'
    required: false
    default: 'false'
  archive-gate-only:
    description: 'Run only the archive gate (implies require-archived) and skip the download and spec check. Put this in a first job and make every other job `needs:` it, so nothing runs until every change is archived.'
    required: false
    default: 'false'
  comment:
    description: 'Post spec drift results as a PR comment (requires pull_request event and write permissions)'
    required: false
    default: 'false'
  token:
    description: 'GitHub token for posting PR comments (defaults to GITHUB_TOKEN)'
    required: false
    default: '${{ github.token }}'

outputs:
  archived:
    description: '"true" when no SDD change is open, "false" when one is, empty when the archive gate did not run.'
    value: ${{ steps.archive-gate.outputs.archived }}

runs:
  using: 'composite'
  steps:
    # The archive gate runs before anything else and needs no SpecSync binary,
    # so a pull request with an open change fails in seconds without spending
    # a download, a build or a test run. The same check backs the `Archive`
    # job in this repository's own CI.
    - name: Require every change to be archived
      id: archive-gate
      if: inputs.require-archived == 'true' || inputs.archive-gate-only == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        ARCHIVE_READINESS: ${{ github.action_path }}/.github/scripts/archive-readiness.sh
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::The archive gate needs python3 on the runner."
          exit 1
        fi
        STATUS=0
        MESSAGE="$(bash "$ARCHIVE_READINESS" .)" || STATUS=$?
        if [ "$STATUS" -eq 0 ]; then
          echo "archived=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Archive::${MESSAGE}"
        else
          echo "archived=false" >> "$GITHUB_OUTPUT"
          echo "::error title=Archive::${MESSAGE}"
        fi
        {
          echo "### SpecSync archive gate"
          echo
          echo "$MESSAGE"
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$STATUS"

    - name: Download SpecSync
      if: inputs.archive-gate-only != 'true'
      shell: bash
      env:
        SPECSYNC_VERSION: ${{ inputs.version }}
        SPECSYNC_DOWNLOAD_BASE_URL: ${{ inputs.download-base-url }}
      run: |
        set -euo pipefail

        # Detect OS
        case "$RUNNER_OS" in
          Linux)   OS="linux" ;;
          macOS)   OS="macos" ;;
          Windows)
            echo "::error::Windows is not a supported target as of SpecSync 6.0; no Windows binary is published. Run SpecSync under WSL, or build from source with 'cargo install specsync'."
            exit 1
            ;;
          *)
            echo "::error::Unsupported runner OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        # Detect architecture
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64)  ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        REPO="CorvidLabs/spec-sync"

        # Determine download URL
        if [ -n "$SPECSYNC_DOWNLOAD_BASE_URL" ]; then
          BASE_URL="${SPECSYNC_DOWNLOAD_BASE_URL%/}"
        elif [ "$SPECSYNC_VERSION" = "latest" ]; then
          BASE_URL="https://github.com/${REPO}/releases/latest/download"
        else
          BASE_URL="https://github.com/${REPO}/releases/download/v${SPECSYNC_VERSION}"
        fi

        # Download and install
        INSTALL_DIR="${RUNNER_TEMP}/specsync"
        mkdir -p "$INSTALL_DIR"

        ARCHIVE="specsync-${OS}-${ARCH}.tar.gz"
        curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "${INSTALL_DIR}/${ARCHIVE}"

        curl -fsSL "${BASE_URL}/${ARCHIVE}.sha256" -o "${INSTALL_DIR}/${ARCHIVE}.sha256"
        echo "Verifying checksum..."
        cd "$INSTALL_DIR"
        shasum -a 256 -c "${ARCHIVE}.sha256"
        echo "::notice::Checksum verified"
        cd -

        tar xz -C "$INSTALL_DIR" -f "${INSTALL_DIR}/${ARCHIVE}"
        mv "${INSTALL_DIR}/specsync-${OS}-${ARCH}" "${INSTALL_DIR}/specsync"
        chmod +x "${INSTALL_DIR}/specsync"

        # Add to PATH
        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
        echo "::notice::SpecSync installed (${OS}/${ARCH}) from ${BASE_URL}/${ARCHIVE}"

    - name: Run SpecSync
      if: inputs.archive-gate-only != 'true'
      shell: bash
      id: specsync
      working-directory: ${{ inputs.root }}
      env:
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_REQUIRE_COVERAGE: ${{ inputs.require-coverage }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_LIFECYCLE_ENFORCE: ${{ inputs.lifecycle-enforce }}
      run: |
        set -euo pipefail

        if ! [[ "$INPUT_REQUIRE_COVERAGE" =~ ^[0-9]+$ ]] || [ "$INPUT_REQUIRE_COVERAGE" -gt 100 ]; then
          echo "::error::require-coverage must be an integer from 0 to 100"
          exit 1
        fi

        # Always use --force in CI — hash cache is not committed, so
        # every CI run validates all specs from scratch.
        CMD=(specsync check --force)

        if [ "$INPUT_STRICT" = "true" ]; then
          CMD+=(--strict)
        fi

        if [ "$INPUT_REQUIRE_COVERAGE" != "0" ]; then
          CMD+=(--require-coverage "$INPUT_REQUIRE_COVERAGE")
        fi

        if [ -n "$INPUT_ARGS" ]; then
          # INPUT_ARGS is intentionally split on whitespace only across all lines.
          # Shell quoting, substitutions, pipes, and other shell syntax are not evaluated.
          NORMALIZED_ARGS="${INPUT_ARGS//$'\r'/ }"
          NORMALIZED_ARGS="${NORMALIZED_ARGS//$'\n'/ }"
          NORMALIZED_ARGS="${NORMALIZED_ARGS//$'\t'/ }"
          read -r -a EXTRA_ARGS <<< "$NORMALIZED_ARGS"
          CMD+=("${EXTRA_ARGS[@]}")
        fi

        echo "::group::SpecSync Check"
        printf 'Running:'
        printf ' %q' "${CMD[@]}"
        printf '\n'
        EXIT_CODE=0
        "${CMD[@]}" || EXIT_CODE=$?
        echo "::endgroup::"

        # If lifecycle enforcement is enabled, run it (may override exit code)
        if [ "$INPUT_LIFECYCLE_ENFORCE" = "true" ]; then
          echo "::group::SpecSync Lifecycle Enforce"
          specsync lifecycle enforce --all || EXIT_CODE=$?
          echo "::endgroup::"
        fi

        # If comment mode is enabled, generate the rich comment body
        # Uses the same `specsync comment` pipeline as our own CI workflow
        # for identical output between the marketplace action and direct usage.
        if [ "$INPUT_COMMENT" = "true" ]; then
          COMMENT_CMD=(specsync comment)
          if [ "$INPUT_STRICT" = "true" ]; then
            COMMENT_CMD+=(--strict)
          fi
          if [ "$INPUT_REQUIRE_COVERAGE" != "0" ]; then
            COMMENT_CMD+=(--require-coverage "$INPUT_REQUIRE_COVERAGE")
          fi
          COMMENT_OUTPUT=$("${COMMENT_CMD[@]}" 2>/dev/null) || true
          {
            echo "SPECSYNC_MARKDOWN<<SPECSYNC_EOF"
            echo "$COMMENT_OUTPUT"
            echo "SPECSYNC_EOF"
          } >> "$GITHUB_ENV"
        fi

        exit $EXIT_CODE

    - name: Post PR Comment
      if: inputs.comment == 'true' && inputs.archive-gate-only != 'true' && github.event_name == 'pull_request' && always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        if [ -z "${SPECSYNC_MARKDOWN:-}" ]; then
          echo "No drift output to comment"
          exit 0
        fi

        COMMENT_BODY="$(printf '%s\n\n---\n<sub>Posted by [SpecSync](https://github.com/CorvidLabs/spec-sync) via GitHub Actions</sub>' "$SPECSYNC_MARKDOWN")"

        # Check for existing SpecSync comment and update it, or create new
        EXISTING_COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("Posted by [SpecSync]")) | .id' | head -1)

        if [ -n "$EXISTING_COMMENT_ID" ]; then
          gh api "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
            -X PATCH -f body="$COMMENT_BODY" > /dev/null
          echo "::notice::Updated existing SpecSync PR comment"
        else
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$COMMENT_BODY" > /dev/null
          echo "::notice::Posted SpecSync PR comment"
        fi
