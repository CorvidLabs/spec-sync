[tasks.build]
cmd = "cargo build --release"

[tasks.test]
cmd = "cargo test"

# The same test set as `test` (the crate is binary-only, so there are no doc-tests that nextest
# would skip), one process per test. The release-candidate lane uses it because macOS pays for
# every process spawn and nextest schedules the slow lifecycle tests first (#861).
[tasks.test-nextest]
cmd = "cargo nextest run --no-fail-fast"

[tasks.lint]
cmd = "cargo clippy -- -D warnings"

[tasks.fmt]
cmd = "cargo fmt --check"

[tasks.audit]
cmd = "cargo audit --ignore RUSTSEC-2024-0384"

[tasks.check-types]
cmd = "cargo check"

[tasks.release-candidate-test]
cmd = "python3 .github/scripts/test-validate-release-candidate.py"

# Required CI gate contract and per-classify-path simulation (#796).
[tasks.ci-gate-test]
cmd = "python3 .github/scripts/test-required-ci-gate.py"

# The Linux release baseline: release/CI/docs lockstep with the check's table, and the check's own
# logic against a fake docker (#882). The real containers run in CI and in the release workflows.
[tasks.linux-baseline-test]
cmd = "python3 .github/scripts/test-linux-baseline.py"

[tasks.spec-check]
cmd = "cargo run -- check --strict --require-coverage 100 --force"

# Prefer release binary — avoids recompiling the whole crate on every pre-push.
[tasks.spec-check-fast]
cmd = "bash scripts/spec-check-fast.sh"

# Timed benchmark against a Raven-sized fixture (124 archived changes, 120 specs).
[tasks.bench-archived-reads]
cmd = "cargo test --release --locked --bin specsync -- --ignored raven_sized_archived_status_benchmark --nocapture"

[tasks.pre-push]
cmd = "bash scripts/pre-push-gate.sh"

[tasks.docs-test]
cmd = "cd site && bun test"

[tasks.docs-lint]
cmd = "cd site && bun run lint"

[tasks.docs-build]
cmd = "cd site && bun run build"

[tasks.vscode-compile]
cmd = "cd vscode-extension && bun run compile"

[tasks.vscode-package]
cmd = "cd vscode-extension && bun run package"

[lanes.check]
description = "Quick pre-commit check"
steps = [{ parallel = ["fmt", "lint"] }, "test"]

[lanes.ci]
description = "Full CI pipeline"
steps = [
  "fmt",
  "lint",
  "test",
  "build",
  "audit",
  "spec-check",
  "release-candidate-test",
  "ci-gate-test",
  "linux-baseline-test",
  { parallel = ["docs-test", "docs-lint", "docs-build", "vscode-compile", "vscode-package"] },
]

[lanes.pre-commit]
description = "Fast gate before committing"
steps = [{ parallel = ["fmt", "lint"] }, "check-types"]

# Keep this FAST. Clippy + cargo test belong in verify/ci, not pre-push.
[lanes.pre-push]
description = "MANDATORY before every git push — fast: fmt + types + path/spec coverage"
steps = ["pre-push"]

# Full local confidence. GitHub CI owns the multi-OS suite; do not point
# .trust.toml lifecycle at this lane on CI (that was a duplicate suite).
[lanes.verify]
description = "Full local verification (fmt/lint/types + test + release build + strict specs)"
steps = [
  { parallel = ["fmt", "lint", "check-types"] },
  "test",
  "build",
  "spec-check",
  "release-candidate-test",
  "ci-gate-test",
  "linux-baseline-test",
]

# Used by .trust.toml [lifecycle] for the GitHub Trust action only.
# CI already ran tests/clippy/spec-check; Trust must not re-run them.
[lanes.trust-lifecycle]
description = "Trust GitHub lifecycle — no duplicate cargo test (CI is authority)"
steps = ["check-types"]

# The release workflow runs this exact lane on Ubuntu and macOS (the
# `REQUIRED_PLATFORMS` set; Windows is not built or qualified in 6.0) for one
# immutable RC tag. Keep platform qualification here so local reproduction
# and every hosted runner share one command surface.
[lanes.release-candidate]
description = "Immutable release-candidate qualification (tests under cargo-nextest + release build)"
steps = ["test-nextest", "build"]

[lanes.repo]
description = "Full repository validation, including docs and editor extension"
steps = [
  { parallel = ["fmt", "lint", "check-types"] },
  "test",
  "build",
  "audit",
  "spec-check",
  "release-candidate-test",
  "ci-gate-test",
  "linux-baseline-test",
  { parallel = ["docs-test", "docs-lint", "docs-build", "vscode-compile", "vscode-package"] },
]
